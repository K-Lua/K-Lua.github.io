    <script>
        const tabs = document.querySelectorAll('.tab-btn')
        const tabContents = document.querySelectorAll('.tab-content')
        tabs.forEach(tab => {
            tab.onclick = function() {
                tabs.forEach(t => t.classList.remove('active'))
                tabContents.forEach(c => c.classList.remove('active'))
                tab.classList.add('active')
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active')
                if (tab.dataset.tab === 'gallery') {
                    startAutoScroll()
                } else {
                    if (autoScrollTimer) {
                        clearInterval(autoScrollTimer)
                        autoScrollTimer = null
                    }
                }
            }
        })

        const galleryImages = [
            '../assets/images/079hacking.mp4'
        ]
        let galleryIndex = 0
        let autoScrollTimer = null
        let lastInteraction = Date.now()
        const galleryViewport = document.getElementById('galleryViewport')
        const galleryIndicators = document.getElementById('galleryIndicators')

        function renderGallery(current, next, direction) {
            galleryViewport.innerHTML = ''
            const currentSrc = galleryImages[current]
            let currentMedia
            if (currentSrc.endsWith('.mp4')) {
                currentMedia = document.createElement('video')
                currentMedia.src = currentSrc
                currentMedia.autoplay = true
                currentMedia.loop = true
                currentMedia.muted = true
                currentMedia.playsInline = true
                currentMedia.className = 'gallery-image'
                currentMedia.style.transform = 'translateX(0)'
                currentMedia.style.width = '400px'
                currentMedia.style.height = '400px'
            } else {
                currentMedia = document.createElement('img')
                currentMedia.src = ''
                setTimeout(function() {
                    currentMedia.src = currentSrc
                }, 0)
                currentMedia.className = 'gallery-image'
                currentMedia.style.transform = 'translateX(0)'
            }
            galleryViewport.appendChild(currentMedia)

            if (next !== null) {
                const nextSrc = galleryImages[next]
                let nextMedia
                if (nextSrc.endsWith('.mp4')) {
                    nextMedia = document.createElement('video')
                    nextMedia.src = nextSrc
                    nextMedia.autoplay = true
                    nextMedia.loop = true
                    nextMedia.muted = true
                    nextMedia.playsInline = true
                    nextMedia.className = 'gallery-image'
                    nextMedia.style.transform = direction === 'left' ? 'translateX(-400px)' : 'translateX(400px)'
                    nextMedia.style.width = '400px'
                    nextMedia.style.height = '400px'
                } else {
                    nextMedia = document.createElement('img')
                    nextMedia.src = ''
                    setTimeout(function() {
                        nextMedia.src = nextSrc
                    }, 0)
                    nextMedia.className = 'gallery-image'
                    nextMedia.style.transform = direction === 'left' ? 'translateX(-400px)' : 'translateX(400px)'
                }
                galleryViewport.appendChild(nextMedia)
                setTimeout(function() {
                    currentMedia.style.transform = direction === 'left' ? 'translateX(400px)' : 'translateX(-400px)'
                    nextMedia.style.transform = 'translateX(0)'
                }, 10)
                setTimeout(function() {
                    renderGallery(next, null, null)
                    updateIndicators()
                }, 500)
            }
        }

        function updateIndicators() {
            galleryIndicators.innerHTML = ''
            for (let i = 0; i < galleryImages.length; i++) {
                const ball = document.createElement('button')
                ball.className = 'gallery-ball' + (i === galleryIndex ? ' active' : '')
                ball.onclick = function() {
                    if (i !== galleryIndex) {
                        lastInteraction = Date.now()
                        renderGallery(galleryIndex, i, i < galleryIndex ? 'left' : 'right')
                        galleryIndex = i
                        if (autoScrollTimer) {
                            clearInterval(autoScrollTimer)
                            autoScrollTimer = null
                        }
                    }
                }
                galleryIndicators.appendChild(ball)
            }
        }

        function nextImage() {
            const nextIndex = (galleryIndex + 1) % galleryImages.length
            renderGallery(galleryIndex, nextIndex, 'right')
            galleryIndex = nextIndex
        }

        galleryIndicators.addEventListener('click', function() {
            lastInteraction = Date.now()
        })

        renderGallery(galleryIndex, null, null)
        updateIndicators()

        function startAutoScroll() {
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer)
            }
            autoScrollTimer = setInterval(function() {
                if (Date.now() - lastInteraction > 4000 && document.getElementById('tab-gallery').classList.contains('active')) {
                    //nextImage()
                }
            }, 4000)
        }

local function ShortCircuit(ply, ent, dmg, radius)
    if (not IsValid(ent) or not IsValid(ply)) then
        return
    end

    local tesla = ents.Create("point_tesla")
    tesla:SetParent(ent)
    local forward = ent:GetForward()

    local offsetPos = ent:GetPos() + forward * 20

    tesla:SetPos(offsetPos)
    tesla:SetKeyValue("m_SoundName", "DoSpark")
    tesla:SetKeyValue("texture", "sprites/laserbeam.spr")
    tesla:SetKeyValue("m_Color", "150 255 255")
    tesla:SetKeyValue("rendercolor", "100 255 255")
    tesla:SetKeyValue("m_flRadius", 50)
    tesla:SetKeyValue("beamcount_max", "1")
    tesla:SetKeyValue("thick_min", "0.1")
    tesla:SetKeyValue("thick_max", "0.2")
    tesla:SetKeyValue("lifetime_min", "0.1")
    tesla:SetKeyValue("lifetime_max", "0.25")
    tesla:SetKeyValue("interval_min", "0.1")
    tesla:SetKeyValue("interval_max", "0.25")
    tesla:Spawn()
    tesla:Fire("DoSpark", "", 0)

    if (tesla:IsValid()) then
        tesla:Fire("turnon", "", 0.01)
    end

    timer.Simple(0.5, function()
        if (tesla:IsValid()) then
            tesla:Remove()
        end
    end)

    for _, target in player.Iterator() do
        if (target != ply and IsValid(target)) then
            local distance = ent:GetPos():Distance(target:GetPos())

            if (distance <= radius) then
                local adjustedDmg = dmg * (1 - (distance / radius))

                local dmgInfo = DamageInfo()
                dmgInfo:SetAttacker(ply)
                dmgInfo:SetInflictor(ent)
                dmgInfo:SetDamage(adjustedDmg)
                dmgInfo:SetDamageType(DMG_SHOCK)

                target:TakeDamageInfo(dmgInfo)
            end
        end
    end
end

function SCP079.GetHacksForEntity(ent)
    if (not IsValid(ent)) then
        return
    end
    for key, config in pairs(SCP079.Hackables) do
        if (config.filter and config.filter(ent)) or (not config.filter and ent:GetClass() == key) then
            return config.hacks, config, key
        end
    end
end

local cachedEntities, lastCache = {}, 0
function SCP079.GetHackableEntities()
    if (CurTime() - lastCache < 1) then
        return cachedEntities
    end
    lastCache = CurTime()
    local entities = {}
    for _, ent in ents.Iterator() do
        local hacks = SCP079.GetHacksForEntity(ent)
        if (hacks) then
            table.insert(entities, ent)
        end
    end

    cachedEntities = entities
    return entities
end

        local cfg = SCP079.Config
        newEnergy = math.Clamp(newEnergy, 0, cfg.maxEnergy)
        energySquares = energySquares or {}
        for i = 1, cfg.maxEnergy do
            energySquares[i] = energySquares[i] or {
                lerpValue = 0,
                size = cfg.initialSquareSize,
                targetSize = cfg.initialSquareSize,
                alpha = 255,
                targetAlpha = 255,
                color = white,
                targetColor = white
            }
        end

        if (newEnergy != currentEnergy) then
            if (newEnergy < currentEnergy) then
                for i = currentEnergy, newEnergy + 1, -1 do
                    if (i > 0 and i <= cfg.maxEnergy) then
                        local square = energySquares[i]
                        square.lerpValue = 0
                        square.targetSize = 60
                        square.targetAlpha = 0
                        square.targetColor = Color(0, 0, 255)
                    end
                end
            else
                for i = currentEnergy + 1, newEnergy do
                    if (i > 0 and i <= cfg.maxEnergy) then
                        local square = energySquares[i]
                        square.lerpValue = 0
                        square.targetSize = cfg.initialSquareSize
                        square.targetAlpha = 255

    function SCP079.GetTargetInFOV(player, targetEntities, fov)
        local selectedTarget = nil
        local maxDistSqr = maxTargetDistance ^ 2
        local bestDot = math.cos(math.rad(fov / 2))

        for _, ent in ipairs(targetEntities) do
            if (IsValid(ent)) then
                local distSqr = player:GetPos():DistToSqr(ent:GetPos())
                if (distSqr <= maxDistSqr and SCP079.IsVisible(player, ent)) then
                    local entPos = ent:GetPos()
                    local aimPos = player:GetShootPos()
                    local aimDir = player:GetAimVector()
                    local dirToEnt = (entPos - aimPos):GetNormalized()
                    local dot = aimDir:Dot(dirToEnt)

                    if (dot >= bestDot) then
                        bestDot = dot
                        selectedTarget = ent
                    end
                end
            end
        end
        return selectedTarget
    end

    function SCP079.IsInFOV(player, ent, fov)
        local entPos = ent:GetPos()
        local aimPos = player:GetShootPos()
        local aimDir = player:GetAimVector()
        local dirToEnt = (entPos - aimPos):GetNormalized()
        local dot = aimDir:Dot(dirToEnt)
        dot = math.Clamp(dot, -1, 1)
        return math.deg(math.acos(dot)) <= (fov / 2)
    end

    function SCP079.IsVisible(player, ent)
        local trace = util.TraceLine({
            start = player:EyePos(),
            endpos = ent:EyePos() or ent:GetPos(),
            filter = player,
            mask = MASK_SHOT
        })
        return trace.Entity == ent
    end

        net.WriteString(selectedHack.name)

                local square = energySquares[i]
                if (square) then
                    square.lerpValue = math.min(square.lerpValue + FrameTime() * 3, 1)
                    square.size = Lerp(square.lerpValue, square.size, square.targetSize)
                    square.alpha = Lerp(square.lerpValue, square.alpha, square.targetAlpha)
                    square.color = SCP079.LerpColor(square.lerpValue, square.color, square.targetColor)

                    if (i <= currentEnergy and square.alpha > 0) then
                        local squareX = barX + cumulativeWidth + (cfg.initialSquareSize - square.size) / 2
                        local squareY = barY + (cfg.initialSquareSize - square.size) / 2
                        cumulativeWidth = cumulativeWidth + cfg.initialSquareSize + cfg.spacing

                        surface.SetDrawColor(ColorAlpha(square.color, square.alpha))
                        draw.RoundedBox(2, squareX, squareY, square.size, square.size, ColorAlpha(square.color, square.alpha))
                    end
                end
            end

            surface.SetDrawColor(37, 46, 51, 12)
            surface.DrawRect(0, 0, w, h)
            surface.SetMaterial(cfg.scanlines)
            surface.SetDrawColor(255, 255, 255, 120)
            surface.DrawTexturedRectUV(0, 0, w, h, 1, 0.4 + offset, 0.4, 1 + offset)

            if (messageData and messageData.parts) then
                local elapsed = CurTime() - messageData.startTime
                local crosshairX, crosshairY = w / 2, h / 2
                local contentX, contentY, alignX
                local totalDelay = 0

                if (messageData.position == 1) then
                    contentX = w / 2 + 100
                    contentY = h / 2 - 100
                    alignX = TEXT_ALIGN_LEFT
                elseif (messageData.position == 2) then
                    contentX = w / 2 - 400
                    contentY = h / 2 + 100
                    alignX = TEXT_ALIGN_LEFT
                elseif (messageData.position == 3) then
                    contentX = 10
                    contentY = 10
                    alignX = TEXT_ALIGN_LEFT
                else
                    contentX = crosshairX - 100
                    contentY = crosshairY - 100
                    alignX = TEXT_ALIGN_RIGHT
                end

                local startX, startY = contentX, contentY

                for i, part in ipairs(messageData.parts) do
                    totalDelay = totalDelay + (part.delay or 0)
                    if (elapsed >= totalDelay) then
                        local font = part.font or digitalFont24
                        surface.SetFont(font)
                        local textWidth, textHeight = vderma:GetTextSize(part.text)
                        if (i > 1 and (messageData.parts[i].line != messageData.parts[i - 1].line or part.newLine)) then
                            contentX = startX
                            contentY = contentY + textHeight + 5
                        end
                        draw.SimpleText(part.text, font, contentX, contentY, part.color or white, alignX, TEXT_ALIGN_TOP)
                        if (part.sound and not part.soundPlayed) then
                            surface.PlaySound(part.sound)
                            part.soundPlayed = true
                        end
                        if (alignX == TEXT_ALIGN_LEFT) then
                            contentX = contentX + textWidth + 5
                        else
                            contentX = contentX - textWidth - 5
                        end
                    end
                end

                if (elapsed >= totalDelay + 1 and not deleteStartTime) then
                    deleteStartTime = CurTime()
                end

                if (deleteStartTime and CurTime() >= deleteStartTime) then
                    local timeSinceDeleteStart = CurTime() - deleteStartTime
                    local partsToDelete = math.floor(timeSinceDeleteStart / 0.1)
                    if (partsToDelete >= #messageData.parts) then
                        messageData = nil
                        return
                    end
                    contentX, contentY = startX, startY
                    for i = 1, #messageData.parts - partsToDelete do
                        local part = messageData.parts[i]
                        local font = part.font or digitalFont24
                        surface.SetFont(font)
                        local textWidth, textHeight = vderma:GetTextSize(part.text)
                        if (i > 1 and (messageData.parts[i].line != messageData.parts[i - 1].line or part.newLine)) then
                            contentX = startX
                            contentY = contentY + textHeight + 5
                        end
                        draw.SimpleText(part.text, font, contentX, contentY, part.color or white, alignX, TEXT_ALIGN_TOP)
                        if (alignX == TEXT_ALIGN_LEFT) then
                            contentX = contentX + textWidth + 5
                        else
                            contentX = contentX - textWidth - 5
                        end
                    end
                end
            end
        end)

        cam.End2D()

        if (not success) then
            print("Error: " .. err)
        end
    end

function SCP079:Think()
    if (SERVER) then
        local ply = VWAR.SCP:GetPlayer("scp_079")

        if (IsValid(ply) and ply:GetMoveType() != MOVETYPE_NOCLIP) then
            ply:SetMoveType(MOVETYPE_NOCLIP)
            ply:SetCollisionGroup(COLLISION_GROUP_WORLD)
        end

        if (IsValid(ply)) then
            ply:DrawWorldModel(false)
        end

        local pos = self:GetMapData("hack_pos")
        if (not pos) then
            return
        end

        if (IsValid(SCP079HackEnt)) then
            SCP079HackEnt:SetPos(pos)
        else
            for k, v in pairs (ents.GetAllCached()) do
                if (v.SCP079HackEnt) then
                    SCP079HackEnt = v
                    break
                end
            end

            if (not IsValid(SCP079HackEnt)) then
                SCP079HackEnt = ents.Create("vwar_scp_079_pc")

                if (IsValid(SCP079HackEnt)) then
                    SCP079HackEnt:SetPos(pos)
                    SCP079HackEnt:Spawn()

                    local phys = SCP079HackEnt:GetPhysicsObject()
                    if (IsValid(phys)) then
                        phys:EnableMotion(false)
                    end
                end
            end
        end
    end
end

        function renderCodeTabs() {
            codeViewerTabs.innerHTML = ''
            codeFiles.forEach((file, idx) => {
                const btn = document.createElement('button')
                btn.className = 'code-viewer-tab' + (idx === currentCodeFile ? ' active' : '')
                btn.textContent = file.name + ` (${file.lines} lines)`
                if (file.realm) {

                if (file.private) {
                    btn.classList.add('locked')
                    btn.onclick = function(e) {
                        e.preventDefault()
                        showPrivatePopup()
                    }
                } else {
                    btn.onclick = function() {
                        if (currentCodeFile !== idx) {
                            currentCodeFile = idx
                            renderCode()
                            renderCodeTabs()
                            renderFuncList()
                        }
                    }
                }
                codeViewerTabs.appendChild(btn)
            })
        }

        function highlightLuau(code) {
            const keywords = /\b(local|function|return|if|then|end|not|and|or)\b/g
            const strings = /(["'])(?:(?=(\\?))\2.)*?\1/g
            const numbers = /\b\d+(\.\d+)?\b/g

            let html = code
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')

            html = html.replace(strings, m => `<span class="code-highlight-string">${m}</span>`)
            html = html.replace(keywords, m => `<span class="code-highlight-keyword">${m}</span>`)
            html = html.replace(numbers, m => `<span class="code-highlight-number">${m}</span>`)

            return html
        }

        function renderCode() {
            const file = codeFiles[currentCodeFile]
            const lines = file.content.split('\n')

            codeContainer.innerHTML = ''

            const containerStyles = window.getComputedStyle(codeContainer)
            const minHeight = parseInt(containerStyles.minHeight)
            const maxHeight = parseInt(containerStyles.maxHeight)
            let containerHeight = codeContainer.offsetHeight
            if (containerHeight < minHeight) containerHeight = minHeight
            if (containerHeight > maxHeight) containerHeight = maxHeight

            const codeWrapper = document.createElement('div')
            codeWrapper.style.display = 'flex'
            codeWrapper.style.width = '100%'
            codeWrapper.style.height = '100%'
            codeWrapper.style.position = 'relative'

            const codeLines = document.createElement('div')
            codeLines.className = 'code-lines'
            codeLines.style.flex = 'none'
            codeLines.style.overflow = 'hidden'
            codeLines.style.display = 'block'
            codeLines.style.boxSizing = 'border-box'
            codeLines.style.height = '100%'
            codeLines.innerHTML = lines.map((_, i) => i + 1).join('<br>')

            const codeContent = document.createElement('div')
            codeContent.className = 'code-content'
            codeContent.style.height = '100%'
            codeContent.style.overflowY = 'auto'
            codeContent.style.flex = '1'
            codeContent.style.boxSizing = 'border-box'
            codeContent.style.background = '#23272a'
            codeContent.style.display = 'flex'
            codeContent.style.flexDirection = 'column'
            codeContent.style.justifyContent = 'stretch'
            codeContent.innerHTML = `<pre style="margin:0;white-space:pre-wrap;word-break:break-word; height:100%; display:flex; flex-direction:column; justify-content:stretch;"><code class="hljs" style="flex:1;">${highlightLuau(file.content)}</code></pre>`

            codeWrapper.appendChild(codeLines)
            codeWrapper.appendChild(codeContent)

            codeContainer.appendChild(codeWrapper)

            codeContent.onscroll = function() {
                codeLines.scrollTop = codeContent.scrollTop
            }
        }

        function getFunctions(code) {
            const funcRegex = /function\s+([a-zA-Z_][\w]*)\s*\(([^)]*)\)/g
            const lines = code.split('\n')
            let match, funcs = []
            while ((match = funcRegex.exec(code)) !== null) {
                let lineNum = 0
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes(match[0])) {
                        lineNum = i
                        break
                    }
                }
                funcs.push({
                    name: match[1],
                    params: match[2],
                    line: lineNum
                })
            }
            return funcs
        }

        function renderFuncList() {
            const file = codeFiles[currentCodeFile]
            const funcs = getFunctions(file.content)
            codeViewerFuncs.innerHTML = ''
            funcs.forEach(func => {
                const div = document.createElement('div')
                div.style.cursor = 'pointer'
                div.style.marginBottom = '10px'
                div.innerHTML = `<span class="code-highlight-func">${func.name}</span><span class="code-highlight-param">(${func.params})</span>`
                div.onclick = function() {
                    const codeContent = codeContainer.querySelector('.code-content')
                    const codeLines = codeContainer.querySelector('.code-lines')
                    const lineHeight = codeContent.scrollHeight / codeContent.innerText.split('\n').length
                    codeContent.scrollTop = func.line * lineHeight
                    codeLines.scrollTop = func.line * lineHeight
                }
                codeViewerFuncs.appendChild(div)
            })
        }

        renderCodeTabs()
        renderCode()
        renderFuncList()
    </script>
