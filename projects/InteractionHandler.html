        const tabs = document.querySelectorAll('.tab-btn')
        const tabContents = document.querySelectorAll('.tab-content')
        tabs.forEach(tab => {
            tab.onclick = function() {
                tabs.forEach(t => t.classList.remove('active'))
                tabContents.forEach(c => c.classList.remove('active'))
                tab.classList.add('active')
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active')
                if (tab.dataset.tab === 'gallery') {
                    startAutoScroll()
                } else {
                    if (autoScrollTimer) {
                        clearInterval(autoScrollTimer)
                        autoScrollTimer = null
                    }
                }
            }
        })

        const galleryImages = [
        ]
        let galleryIndex = 0
        let autoScrollTimer = null
        let lastInteraction = Date.now()
        const galleryViewport = document.getElementById('galleryViewport')
        const galleryIndicators = document.getElementById('galleryIndicators')

        function renderGallery(current, next, direction) {
            const currentSrc = galleryImages[current]
            if (!currentSrc) {
                return
            }
            galleryViewport.innerHTML = ''
            let currentMedia
            if (currentSrc.endsWith('.mp4')) {
                currentMedia = document.createElement('video')
                currentMedia.src = currentSrc
                currentMedia.autoplay = true
                currentMedia.loop = true
                currentMedia.muted = true
                currentMedia.playsInline = true
                currentMedia.className = 'gallery-image'
                currentMedia.style.transform = 'translateX(0)'
                currentMedia.style.width = '400px'
                currentMedia.style.height = '400px'
            } else {
                currentMedia = document.createElement('img')
                currentMedia.src = ''
                setTimeout(function() {
                    currentMedia.src = currentSrc
                }, 0)
                currentMedia.className = 'gallery-image'
                currentMedia.style.transform = 'translateX(0)'
            }
            galleryViewport.appendChild(currentMedia)

            if (next !== null) {
                const nextSrc = galleryImages[next]
                let nextMedia
                if (nextSrc.endsWith('.mp4')) {
                    nextMedia = document.createElement('video')
                    nextMedia.src = nextSrc
                    nextMedia.autoplay = true
                    nextMedia.loop = true
                    nextMedia.muted = true
                    nextMedia.playsInline = true
                    nextMedia.className = 'gallery-image'
                    nextMedia.style.transform = direction === 'left' ? 'translateX(-400px)' : 'translateX(400px)'
                    nextMedia.style.width = '400px'
                    nextMedia.style.height = '400px'
                } else {
                    nextMedia = document.createElement('img')
                    nextMedia.src = ''
                    setTimeout(function() {
                        nextMedia.src = nextSrc
                    }, 0)
                    nextMedia.className = 'gallery-image'
                    nextMedia.style.transform = direction === 'left' ? 'translateX(-400px)' : 'translateX(400px)'
                }
                galleryViewport.appendChild(nextMedia)
                setTimeout(function() {
                    currentMedia.style.transform = direction === 'left' ? 'translateX(400px)' : 'translateX(-400px)'
                    nextMedia.style.transform = 'translateX(0)'
                }, 10)
                setTimeout(function() {
                    renderGallery(next, null, null)
                    updateIndicators()
                }, 500)
            }
        }

        function updateIndicators() {
            galleryIndicators.innerHTML = ''
            for (let i = 0; i < galleryImages.length; i++) {
                const ball = document.createElement('button')
                ball.className = 'gallery-ball' + (i === galleryIndex ? ' active' : '')
                ball.onclick = function() {
                    if (i !== galleryIndex) {
                        lastInteraction = Date.now()
                        renderGallery(galleryIndex, i, i < galleryIndex ? 'left' : 'right')
                        galleryIndex = i
                        if (autoScrollTimer) {
                            clearInterval(autoScrollTimer)
                            autoScrollTimer = null
                        }
                    }
                }
                galleryIndicators.appendChild(ball)
            }
        }

        function nextImage() {
            const nextIndex = (galleryIndex + 1) % galleryImages.length
            renderGallery(galleryIndex, nextIndex, 'right')
            galleryIndex = nextIndex
        }

        galleryIndicators.addEventListener('click', function() {
            lastInteraction = Date.now()
        })

        renderGallery(galleryIndex, null, null)
        updateIndicators()

        function startAutoScroll() {
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer)
            }
            autoScrollTimer = setInterval(function() {
                if (Date.now() - lastInteraction > 4000 && document.getElementById('tab-gallery').classList.contains('active')) {
                    nextImage()
                }
            }, 4000)
        }
        startAutoScroll()

local Players = game:GetService("Players")
local UserInputService = game:GetService("UserInputService")
local RunService = game:GetService("RunService")
local ReplicatedStorage = game:GetService("ReplicatedStorage")

local defaultConfig = {
    MaxInteractionDistance = 10,
    DefaultKey = "E",
    HoldDuration = 1.5,
    RangeCheckInterval = 0.1,
    DebugMode = false
}

local player = Players.LocalPlayer
local interactionRemote = nil
local interactionSyncRemote = nil
local InteractionUI = nil

local currentInteractable = nil
local isHolding = false
local holdStartTime = 0
local holdConnection = nil
local rangeCheckConnection = nil

local registeredInteractions = {}
local cachedInteractableObjects = {}
local workspaceConnections = {}

local function getInteractionUI()
    if (not InteractionUI) then
        InteractionUI = _G.Module and _G.Module.InteractionUI
        if (not InteractionUI) then
            return nil
        end
    end
    return InteractionUI
end

local function stopHolding()
    if (not isHolding) then
        return
    end

    isHolding = false

    if (holdConnection) then
        holdConnection:Disconnect()
        holdConnection = nil
    end

    local ui = getInteractionUI()
    if (ui and ui.stopHoldProgress) then
        ui.stopHoldProgress()
    end
end

local function addInteractableObject(object)
    local interactionId = object:GetAttribute("InteractionId")
    if (interactionId and registeredInteractions[interactionId]) then
        local uiPart = nil
        if (object:IsA("BasePart")) then
            uiPart = object
        elseif (object:IsA("Model") and object.PrimaryPart) then
            uiPart = object.PrimaryPart
        end
        if (uiPart) then
            cachedInteractableObjects[object] = {
                object = object,
                uiPart = uiPart,
                config = registeredInteractions[interactionId],
                interactionId = interactionId
            }
        end
    end
end

local function removeInteractableObject(object)
    cachedInteractableObjects[object] = nil
    if (currentInteractable and currentInteractable.object == object) then
        local ui = getInteractionUI()
        if (ui and ui.hide) then
            ui.hide()
        end
        currentInteractable = nil
        stopHolding()
    end
end

local function onObjectAdded(object)
    local interactionId = object:GetAttribute("InteractionId")
    if (interactionId) then
        addInteractableObject(object)
    end

    local connection = object:GetAttributeChangedSignal("InteractionId"):Connect(function()
        local newInteractionId = object:GetAttribute("InteractionId")
        if (newInteractionId) then
            addInteractableObject(object)
        else
            removeInteractableObject(object)
        end
    end)

    workspaceConnections[object] = connection
end

local function onObjectRemoved(object)
    removeInteractableObject(object)
    if (workspaceConnections[object]) then
        workspaceConnections[object]:Disconnect()
        workspaceConnections[object] = nil
    end
end

local function refreshInteractableCache()
    cachedInteractableObjects = {}

    for _, object in pairs(workspace:GetDescendants()) do
        local interactionId = object:GetAttribute("InteractionId")
        if (interactionId) then
            if (not workspaceConnections[object]) then
                onObjectAdded(object)
            else
                addInteractableObject(object)
            end
        end
    end
end

local function waitForRemotes()
    interactionRemote = ReplicatedStorage:WaitForChild("InteractionRemote", 10)
    interactionSyncRemote = ReplicatedStorage:WaitForChild("InteractionSyncRemote", 10)
    if (interactionSyncRemote) then
        interactionSyncRemote.OnClientEvent:Connect(function(syncData)
            for id, config in pairs(syncData) do
                InteractionHandler.registerInteraction(id, config)
            end
        end)
    end
end

local function isInRange(object, maxDistance)
    local character = player.Character
    local humanoidRootPart = character and character:FindFirstChild("HumanoidRootPart")
    if (not humanoidRootPart) then
        return false
    end
    local objectPosition = nil
    if (object:IsA("BasePart")) then
        objectPosition = object.Position
    elseif (object:IsA("Model") and object.PrimaryPart) then
        objectPosition = object.PrimaryPart.Position
    end
    if (not objectPosition) then
        return false
    end
    return (humanoidRootPart.Position - objectPosition).Magnitude <= maxDistance
end

local function findClosestInteractable()
    local closestInteractable
    local closestDistance = math.huge
    local humanoidRootPart = player.Character and player.Character:FindFirstChild("HumanoidRootPart")
    if (not humanoidRootPart) then
        return nil
    end
    for _, data in pairs(cachedInteractableObjects) do
        local maxDistance = data.config.MaxDistance or defaultConfig.MaxInteractionDistance
        local objectPosition = data.uiPart and data.uiPart.Position
        if (objectPosition) then
            local distance = (humanoidRootPart.Position - objectPosition).Magnitude
            if (distance <= maxDistance and distance < closestDistance) then
                closestDistance = distance
                closestInteractable = data
            end
        end
    end
    return closestInteractable
end

local function updateInteractionUI()
    local character = player.Character
    local humanoidRootPart = character and character:FindFirstChild("HumanoidRootPart")
    if (not humanoidRootPart) then
        return
    end
    local closestInteractable = findClosestInteractable()
    if (closestInteractable ~= currentInteractable) then
        local ui = getInteractionUI()
        if (ui) then
            if (currentInteractable and ui.hide) then
                ui.hide()
                stopHolding()
            end
            currentInteractable = closestInteractable
            if (currentInteractable) then
                local config = currentInteractable.config
                local key = config.Key or defaultConfig.DefaultKey
                local actionText = config.ActionText or "Interact"
                local interactionType = config.Type or "press"
                local displayMode = config.DisplayMode or "floating"
                ui.show(player.PlayerGui, key, actionText, interactionType, currentInteractable.uiPart, displayMode)
            end
        end
    end
end

local function startRangeChecking()
    if (rangeCheckConnection) then
        return
    end

    rangeCheckConnection = RunService.Heartbeat:Connect(function()
        updateInteractionUI()
    end)
end

local function stopRangeChecking()
    if (rangeCheckConnection) then
        rangeCheckConnection:Disconnect()
        rangeCheckConnection = nil
    end
end

local function startHolding()
    if (isHolding or not currentInteractable) then
        return
    end

    local config = currentInteractable.config
    if (config.Type ~= "hold") then
        return
    end

    isHolding = true
    holdStartTime = tick()

    local ui = getInteractionUI()
    if (ui) then
        local duration = config.HoldDuration or defaultConfig.HoldDuration
        ui.startHoldProgress(duration)
    end

    holdConnection = RunService.Heartbeat:Connect(function()
        if (not currentInteractable or not isInRange(currentInteractable.object, config.MaxDistance or defaultConfig.MaxInteractionDistance)) then
            stopHolding()
            return
        end

        local holdDuration = config.HoldDuration or defaultConfig.HoldDuration
        if (tick() - holdStartTime >= holdDuration) then
            executeInteraction()
            stopHolding()
        end
    end)
end

function executeInteraction()
    if (not currentInteractable or not interactionRemote) then
        return
    end
    local config = currentInteractable.config
    local maxDistance = config.MaxDistance or defaultConfig.MaxInteractionDistance
    if (not isInRange(currentInteractable.object, maxDistance)) then
        return
    end
    if (config.OnComplete) then
        config.OnComplete()
    else
        interactionRemote:FireServer(currentInteractable.interactionId, currentInteractable.object)
    end
end

function InteractionHandler.registerInteraction(interactionId, config)
    if (not interactionId or not config) then
        warn("Invalid interaction registration")
        return
    end

    registeredInteractions[interactionId] = config
    refreshInteractableCache()
end

function InteractionHandler.unregisterInteraction(interactionId)
    registeredInteractions[interactionId] = nil
end

function InteractionHandler.init()
    waitForRemotes()
    workspace.DescendantAdded:Connect(onObjectAdded)
    workspace.DescendantRemoving:Connect(onObjectRemoved)
    refreshInteractableCache()
    startRangeChecking()
    UserInputService.InputBegan:Connect(function(input, gameProcessed)
        if (gameProcessed or not currentInteractable) then
            return
        end
        local config = currentInteractable.config
        local key = config.Key or defaultConfig.DefaultKey
        if (input.KeyCode == Enum.KeyCode[key]) then
            if (config.Type == "hold") then
                startHolding()
            elseif (config.Type == "press" or not config.Type) then
                executeInteraction()
            end
        end
    end)
    UserInputService.InputEnded:Connect(function(input, gameProcessed)
        if (gameProcessed or not currentInteractable) then
            return
        end
        local config = currentInteractable.config
        local key = config.Key or defaultConfig.DefaultKey
        if (input.KeyCode == Enum.KeyCode[key] and config.Type == "hold") then
            stopHolding()
        end
    end)
end

function InteractionHandler.cleanup()
    stopRangeChecking()
    stopHolding()

    local ui = getInteractionUI()
    if (ui and ui.hide) then
        ui.hide()
    end

    for object, connection in pairs(workspaceConnections) do
        connection:Disconnect()
    end
    workspaceConnections = {}
    cachedInteractableObjects = {}
    currentInteractable = nil
end

return InteractionHandler`.trim()

	bottomLeftV.Position = UDim2.new(0, 0, 1, -cornerSize)
	bottomLeftV.BackgroundColor3 = color
	bottomLeftV.BackgroundTransparency = transparency
	bottomLeftV.BorderSizePixel = 0
	bottomLeftV.Parent = parent

	local bottomRightH = Instance.new("Frame")
	bottomRightH.Size = UDim2.new(0, 0, 0, cornerThickness)
	bottomRightH.Position = UDim2.new(1, -cornerSize, 1, -cornerThickness)
	bottomRightH.BackgroundColor3 = color
	bottomRightH.BackgroundTransparency = transparency
	bottomRightH.BorderSizePixel = 0
	bottomRightH.Parent = parent

	local bottomRightV = Instance.new("Frame")
	bottomRightV.Size = UDim2.new(0, cornerThickness, 0, 0)
	bottomRightV.Position = UDim2.new(1, -cornerThickness, 1, -cornerSize)
	bottomRightV.BackgroundColor3 = color
	bottomRightV.BackgroundTransparency = transparency
	bottomRightV.BorderSizePixel = 0
	bottomRightV.Parent = parent

	corners.topLeft = {h = topLeftH, v = topLeftV}
	corners.topRight = {h = topRightH, v = topRightV}
	corners.bottomLeft = {h = bottomLeftH, v = bottomLeftV}
	corners.bottomRight = {h = bottomRightH, v = bottomRightV}

	return corners
end

local function createFloatingUI(object, displayMode)
	local billboardGui = Instance.new("BillboardGui")
	billboardGui.Size = defaultConfig.UISize
	billboardGui.StudsOffset = displayMode == "floating" and defaultConfig.FloatOffset or Vector3.new(0, 0, 0)
	billboardGui.Adornee = object
	billboardGui.LightInfluence = 0
	billboardGui.ResetOnSpawn = false
	billboardGui.AlwaysOnTop = true
	billboardGui.Parent = workspace

	local mainFrame = Instance.new("Frame")
	mainFrame.Size = UDim2.new(0, 0, 0, 0)
	mainFrame.Position = UDim2.new(0.5, 0, 0.5, 0)
	mainFrame.AnchorPoint = Vector2.new(0.5, 0.5)
	mainFrame.BackgroundColor3 = defaultConfig.BackgroundColor
	mainFrame.BackgroundTransparency = defaultConfig.BackgroundTransparency
	mainFrame.BorderSizePixel = 0
	mainFrame.Parent = billboardGui

	local holdProgressFrame = Instance.new("Frame")
	holdProgressFrame.Size = UDim2.new(0, 0, 1, 0)
	holdProgressFrame.Position = UDim2.new(0, 0, 0, 0)
	holdProgressFrame.BackgroundColor3 = defaultConfig.HoldProgressColor
	holdProgressFrame.BackgroundTransparency = defaultConfig.HoldProgressTransparency
	holdProgressFrame.BorderSizePixel = 0
	holdProgressFrame.ZIndex = mainFrame.ZIndex - 1
	holdProgressFrame.Parent = mainFrame

	local progressGradient = Instance.new("UIGradient")
	progressGradient.Color = ColorSequence.new{
		ColorSequenceKeypoint.new(0, Color3.fromRGB(255, 255, 255)),
		ColorSequenceKeypoint.new(0.5, Color3.fromRGB(200, 200, 200)),
		ColorSequenceKeypoint.new(1, Color3.fromRGB(150, 150, 150))
	}
	progressGradient.Transparency = NumberSequence.new{
		NumberSequenceKeypoint.new(0, 0.05),
		NumberSequenceKeypoint.new(1, 0.15)
	}
	progressGradient.Rotation = 0
	progressGradient.Parent = holdProgressFrame

	local outline = Instance.new("UIStroke")
	outline.Color = defaultConfig.OutlineColor
	outline.Transparency = defaultConfig.OutlineTransparency
	outline.Thickness = defaultConfig.OutlineThickness
	outline.Parent = mainFrame

	local corners = createCorners(mainFrame, defaultConfig.CornerSize, defaultConfig.CornerThickness, defaultConfig.CornerColor, 1)

	local keyLabel = Instance.new("TextLabel")
	keyLabel.Size = UDim2.new(1, 0, 1, 0)
	keyLabel.Position = UDim2.new(0, 0, 0, 0)
	keyLabel.BackgroundTransparency = 1
	keyLabel.Text = "E"
	keyLabel.TextColor3 = defaultConfig.KeyTextColor
	keyLabel.TextSize = 0
	keyLabel.Font = Enum.Font.GothamBold
	keyLabel.TextScaled = false
	keyLabel.TextXAlignment = Enum.TextXAlignment.Center
	keyLabel.TextYAlignment = Enum.TextYAlignment.Center
	keyLabel.BorderSizePixel = 0
	keyLabel.Parent = mainFrame

	return {
		billboardGui = billboardGui,
		frame = mainFrame,
		keyLabel = keyLabel,
		outline = outline,
		corners = corners,
		holdProgressFrame = holdProgressFrame,
		progressGradient = progressGradient
	}
end

function InteractionUI.show(parent, key, actionText, interactionType, object, displayMode)
	displayMode = displayMode or defaultConfig.DisplayMode

	if (isShowing and currentObject == object) then
		return
	end

	if (isShowing) then
		InteractionUI.hide()
	end

	if (not object) then
		warn("InteractionUI.show: object is required for floating UI")
		return
	end

	if (not object:IsA("BasePart") and not object:FindFirstChild("PrimaryPart")) then
		return
	end

	local uiData = createFloatingUI(object, displayMode)
	if (not uiData) then
		return
	end

	if (not uiData.billboardGui) then
		return
	end

	if (not uiData.frame) then
		return
	end

	if (not uiData.keyLabel) then
		return
	end

	currentUI = uiData
	currentObject = object
	isShowing = true

	currentUI.keyLabel.Text = key

	local tweenInfo = TweenInfo.new(defaultConfig.AnimationDuration, Enum.EasingStyle.Quart, Enum.EasingDirection.Out)

	local frameTween = TweenService:Create(currentUI.frame, tweenInfo, {
		Size = UDim2.new(1, 0, 1, 0)
	})

	local keyTween = TweenService:Create(currentUI.keyLabel, tweenInfo, {
		TextSize = defaultConfig.KeyTextSize
	})

	local outlineTween = TweenService:Create(currentUI.outline, tweenInfo, {
		Transparency = defaultConfig.OutlineTransparency
	})

	local cornerTweens = {}
	for _, corner in pairs(currentUI.corners) do
		table.insert(cornerTweens, TweenService:Create(corner.h, tweenInfo, {
			Size = UDim2.new(0, defaultConfig.CornerSize, 0, defaultConfig.CornerThickness),
			BackgroundTransparency = defaultConfig.CornerTransparency
		}))
		table.insert(cornerTweens, TweenService:Create(corner.v, tweenInfo, {
			Size = UDim2.new(0, defaultConfig.CornerThickness, 0, defaultConfig.CornerSize),
			BackgroundTransparency = defaultConfig.CornerTransparency
		}))
	end

	frameTween:Play()
	keyTween:Play()
	outlineTween:Play()
	for _, tween in pairs(cornerTweens) do
		tween:Play()
	end
end

function InteractionUI.hide()
	if (not isShowing or not currentUI) then
		return
	end

	if (holdTween) then
		holdTween:Cancel()
		holdTween = nil
	end

	local tweenInfo = TweenInfo.new(defaultConfig.AnimationDuration, Enum.EasingStyle.Quart, Enum.EasingDirection.In)

	local frameTween = TweenService:Create(currentUI.frame, tweenInfo, {
		Size = UDim2.new(0, 0, 0, 0)
	})

	local keyTween = TweenService:Create(currentUI.keyLabel, tweenInfo, {
		TextSize = 0
	})

	local outlineTween = TweenService:Create(currentUI.outline, tweenInfo, {
		Transparency = 1
	})

	local cornerTweens = {}
	for _, corner in pairs(currentUI.corners) do
		table.insert(cornerTweens, TweenService:Create(corner.h, tweenInfo, {
			Size = UDim2.new(0, 0, 0, defaultConfig.CornerThickness),
			BackgroundTransparency = 1
		}))
		table.insert(cornerTweens, TweenService:Create(corner.v, tweenInfo, {
			Size = UDim2.new(0, defaultConfig.CornerThickness, 0, 0),
			BackgroundTransparency = 1
		}))
	end

	frameTween:Play()
	keyTween:Play()
	outlineTween:Play()
	for _, tween in pairs(cornerTweens) do
		tween:Play()
	end

	frameTween.Completed:Connect(function()
		if (currentUI and currentUI.billboardGui) then
			currentUI.billboardGui:Destroy()
		end
		currentUI = nil
		currentObject = nil
		isShowing = false
	end)
end

function InteractionUI.startHoldProgress(duration)
	if (not currentUI or not currentUI.holdProgressFrame) then
		return
	end

	currentUI.holdProgressFrame.Size = UDim2.new(0, 0, 1, 0)
	currentUI.holdProgressFrame.BackgroundTransparency = defaultConfig.HoldProgressTransparency
	currentUI.holdProgressFrame.Visible = true

	local tweenInfo = TweenInfo.new(duration, Enum.EasingStyle.Linear)
	holdTween = TweenService:Create(currentUI.holdProgressFrame, tweenInfo, {
		Size = UDim2.new(1, 0, 1, 0)
	})

	holdTween:Play()
end

function InteractionUI.stopHoldProgress()
	if (holdTween) then
		holdTween:Cancel()
		holdTween = nil
	end

	if (currentUI and currentUI.holdProgressFrame) then
		local tweenInfo = TweenInfo.new(0.2, Enum.EasingStyle.Quart, Enum.EasingDirection.Out)
		local resetTween = TweenService:Create(currentUI.holdProgressFrame, tweenInfo, {
			Size = UDim2.new(0, 0, 1, 0),
			BackgroundTransparency = 1
		})
		resetTween:Play()
		currentUI.holdProgressFrame.Visible = false
	end
end

function InteractionUI.isVisible()
	return isShowing
end

            },
            {
                name: 'InteractionHandler.luau',
                language: 'luau',
                realm: 'server',
                private: true,
                lines: 144,
                content: ``.trim()
            }
        ]

        const codeViewerTabs = document.getElementById('codeViewerTabs')
        const codeContainer = document.getElementById('codeContainer')
        const codeViewerFuncs = document.getElementById('codeViewerFuncs')
        let currentCodeFile = 0

        function showPrivatePopup() {
            if (document.getElementById('privatePopup')) return
            const overlay = document.createElement('div')
            overlay.className = 'popup-overlay'
            overlay.id = 'privatePopup'
            overlay.innerHTML = `
                <div class="popup-box">
                    This file is private for more information contact on discord: k_lua_
                    <br>
                    <button onclick="document.getElementById('privatePopup').remove()">Close</button>
                </div>
            `
            document.body.appendChild(overlay)
        }

        function renderCodeTabs() {
            codeViewerTabs.innerHTML = ''
            codeFiles.forEach((file, idx) => {
                const btn = document.createElement('button')
                btn.className = 'code-viewer-tab' + (idx === currentCodeFile ? ' active' : '')
                btn.textContent = file.name + ` (${file.lines} lines)`
                if (file.realm) {
                    const realmSpan = document.createElement('span')
                    realmSpan.textContent = ` (${file.realm})`
                    realmSpan.style.fontSize = '0.95em'
                    realmSpan.style.color = '#bd93f9'
                    realmSpan.style.marginLeft = '6px'
                    btn.appendChild(realmSpan)
                }
                if (file.private) {
                    btn.classList.add('locked')
                    btn.onclick = function(e) {
                        e.preventDefault()
                        showPrivatePopup()
                    }
                } else {
                    btn.onclick = function() {
                        if (currentCodeFile !== idx) {
                            currentCodeFile = idx
                            renderCode()
                            renderCodeTabs()
                            renderFuncList()
                        }
                    }
                }
                codeViewerTabs.appendChild(btn)
            })
        }

        function highlightLuau(code) {
            const keywords = /\b(local|function|return|if|then|end|not|and|or)\b/g
            const strings = /(["'])(?:(?=(\\?))\2.)*?\1/g
            const numbers = /\b\d+(\.\d+)?\b/g

            let html = code
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')

            html = html.replace(strings, m => `<span class="code-highlight-string">${m}</span>`)
            html = html.replace(keywords, m => `<span class="code-highlight-keyword">${m}</span>`)
            html = html.replace(numbers, m => `<span class="code-highlight-number">${m}</span>`)

            return html
        }

        function renderCode() {
            const file = codeFiles[currentCodeFile]
            const lines = file.content.split('\n')

            codeContainer.innerHTML = ''

            const containerStyles = window.getComputedStyle(codeContainer)
            const minHeight = parseInt(containerStyles.minHeight)
            const maxHeight = parseInt(containerStyles.maxHeight)
            let containerHeight = codeContainer.offsetHeight
            if (containerHeight < minHeight) containerHeight = minHeight
            if (containerHeight > maxHeight) containerHeight = maxHeight

            const codeWrapper = document.createElement('div')
            codeWrapper.style.display = 'flex'
            codeWrapper.style.width = '100%'
            codeWrapper.style.height = '100%'
            codeWrapper.style.position = 'relative'

            const codeLines = document.createElement('div')
            codeLines.className = 'code-lines'
            codeLines.style.flex = 'none'
            codeLines.style.overflow = 'hidden'
            codeLines.style.display = 'block'
            codeLines.style.boxSizing = 'border-box'
            codeLines.style.height = '100%'
            codeLines.innerHTML = lines.map((_, i) => i + 1).join('<br>')

            const codeContent = document.createElement('div')
            codeContent.className = 'code-content'
            codeContent.style.height = '100%'
            codeContent.style.overflowY = 'auto'
            codeContent.style.flex = '1'
            codeContent.style.boxSizing = 'border-box'
            codeContent.style.background = '#23272a'
            codeContent.style.display = 'flex'
            codeContent.style.flexDirection = 'column'
            codeContent.style.justifyContent = 'stretch'
            codeContent.innerHTML = `<pre style="margin:0;white-space:pre-wrap;word-break:break-word; height:100%; display:flex; flex-direction:column; justify-content:stretch;"><code class="hljs" style="flex:1;">${highlightLuau(file.content)}</code></pre>`

            codeWrapper.appendChild(codeLines)
            codeWrapper.appendChild(codeContent)

            codeContainer.appendChild(codeWrapper)

            codeContent.onscroll = function() {
                codeLines.scrollTop = codeContent.scrollTop
            }
        }

        function getFunctions(code) {
            const funcRegex = /function\s+([a-zA-Z_][\w]*)\s*\(([^)]*)\)/g
            const lines = code.split('\n')
            let match, funcs = []
            while ((match = funcRegex.exec(code)) !== null) {
                let lineNum = 0
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes(match[0])) {
                        lineNum = i
                        break
                    }
                }
                funcs.push({
                    name: match[1],
                    params: match[2],
                    line: lineNum
                })
            }
            return funcs
        }

        function renderFuncList() {
            const file = codeFiles[currentCodeFile]
            const funcs = getFunctions(file.content)
            codeViewerFuncs.innerHTML = ''
            funcs.forEach(func => {
                const div = document.createElement('div')
                div.style.cursor = 'pointer'
                div.style.marginBottom = '10px'
                div.innerHTML = `<span class="code-highlight-func">${func.name}</span><span class="code-highlight-param">(${func.params})</span>`
                div.onclick = function() {
                    const codeContent = codeContainer.querySelector('.code-content')
                    const codeLines = codeContainer.querySelector('.code-lines')
                    const lineHeight = codeContent.scrollHeight / codeContent.innerText.split('\n').length
                    codeContent.scrollTop = func.line * lineHeight
                    codeLines.scrollTop = func.line * lineHeight
                }
                codeViewerFuncs.appendChild(div)
            })
        }

        renderCodeTabs()
        renderCode()
        renderFuncList()
    </script>
