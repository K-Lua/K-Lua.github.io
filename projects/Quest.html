<!DOCTYPE html>
<html>
<head>
    <title>Quest System</title>
    <link rel="icon" type="image/png" href="assets/images/klua.png">
    <link rel="stylesheet" type="text/css" href="../assets/styles.css">
    <style>
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }
        .tab-btn {
            background: #23272a;
            color: #e0e0e0;
            border: none;
            border-radius: 8px 8px 0 0;
            padding: 10px 24px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        .tab-btn.active {
            background: linear-gradient(90deg, #7289da 0%, #5865f2 100%);
            color: #fff;
        }
        .tab-content {
            display: none;
            width: 100%;
        }
        .tab-content.active {
            display: block;
        }
        .gallery-container {
            width: 440px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #23272a;
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(40,44,52,0.2);
            padding: 20px 0 12px 0;
        }
        .gallery-viewport {
            width: 400px;
            height: 400px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            background: #181a1b;
            margin-bottom: 12px;
        }
        .gallery-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 400px;
            height: 400px;
            object-fit: cover;
            border-radius: 12px;
            transition: transform 0.5s cubic-bezier(0.4,0,0.2,1), opacity 0.5s cubic-bezier(0.4,0,0.2,1);
            opacity: 1;
            z-index: 1;
        }
        .gallery-image.next,
        .gallery-image.prev {
            z-index: 2;
        }
        .gallery-image.hide {
            opacity: 0;
        }
        .gallery-indicators {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 0;
        }
        .gallery-ball {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #5865f2;
            opacity: 0.4;
            border: none;
            outline: none;
            cursor: pointer;
            transition: opacity 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 0 0 #7289da;
        }
        .gallery-ball.active {
            opacity: 1;
            background: #7289da;
            box-shadow: 0 0 0 3px #7289da44;
        }
        .code-viewer-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .code-viewer-tab {
            background: #23272a;
            color: #e0e0e0;
            border: none;
            border-radius: 8px 8px 0 0;
            padding: 8px 18px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        .code-viewer-tab.active {
            background: linear-gradient(90deg, #23272a 0%, #1e1e1e 100%);
            color: #fff;
        }
        .code-viewer-tab.locked {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .code-viewer-main {
            display: flex;
            gap: 0;
            align-items: flex-start;
            width: 100%;
            position: relative;
        }
        .code-container {
            flex: 1;
            background: linear-gradient(135deg, #23272a 0%, #1e1e1e 100%);
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(40,44,52,0.2);
            padding: 24px 0 24px 0;
            color: #e0e0e0;
            font-family: 'Fira Mono', 'Consolas', monospace;
            font-size: 1rem;
            min-height: 520px;
            max-height: 700px;
            position: relative;
            width: 100%;
            margin-right: 0;
            display: flex;
        }
        .code-lines {
            background: #23272a;
            color: #888;
            text-align: right;
            padding: 24px 8px 24px 0;
            user-select: none;
            font-size: 1rem;
            border-radius: 16px 0 0 16px;
            min-width: 40px;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 2;
            pointer-events: none;
            height: 100%;
        }
        .code-content {
            padding: 24px 32px 24px 56px;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 320px;
            max-height: 480px;
        }
        .code-viewer-funcs {
            position: absolute;
            left: 100%;
            top: 0;
            min-width: 220px;
            max-width: 260px;
            background: #23272a;
            border-radius: 8px;
            padding: 16px 12px;
            color: #e0e0e0;
            font-size: 0.98rem;
            max-height: 480px;
            overflow-y: auto;
            box-shadow: 0 2px 16px rgba(40,44,52,0.15);
            margin-left: 24px;
            display: none;
        }
        .tab-content.active #codeViewerFuncs {
            display: block;
        }
        .code-highlight-keyword { color: #ffb86c; }
        .code-highlight-func { color: #8be9fd; }
        .code-highlight-param { color: #50fa7b; }
        .code-highlight-string { color: #f1fa8c; }
        .code-highlight-number { color: #bd93f9; }
        .code-highlight-operator { color: #ff79c6; }
        .code-highlight-global { color: #ff5555; }
        .code-locked {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 1.2rem;
            color: #ff5555;
            background: #23272a;
            border-radius: 16px;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2;
        }
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(24,26,27,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .popup-box {
            background: #23272a;
            color: #e0e0e0;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(40,44,52,0.3);
            font-size: 1.1rem;
            text-align: center;
        }
        .popup-box button {
            margin-top: 18px;
        }
    </style>
</head>

    <script>
        const tabs = document.querySelectorAll('.tab-btn')
        const tabContents = document.querySelectorAll('.tab-content')
        tabs.forEach(tab => {
            tab.onclick = function() {
                tabs.forEach(t => t.classList.remove('active'))
                tabContents.forEach(c => c.classList.remove('active'))
                tab.classList.add('active')
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active')
                if (tab.dataset.tab === 'gallery') {
                    startAutoScroll()
                } else {
                    if (autoScrollTimer) {
                        clearInterval(autoScrollTimer)
                        autoScrollTimer = null
                    }
                }
            }
        })

        const galleryImages = [
            '../assets/images/QuestSystem.png',
            '../assets/images/Quest.mp4'
        ]
        let galleryIndex = 0
        let autoScrollTimer = null
        let lastInteraction = Date.now()
        const galleryViewport = document.getElementById('galleryViewport')
        const galleryIndicators = document.getElementById('galleryIndicators')

        function renderGallery(current, next, direction) {
            galleryViewport.innerHTML = ''
            const currentSrc = galleryImages[current]
            let currentMedia
            if (currentSrc.endsWith('.mp4')) {
                currentMedia = document.createElement('video')
                currentMedia.src = currentSrc
                currentMedia.autoplay = true
                currentMedia.loop = true
                currentMedia.muted = true
                currentMedia.playsInline = true
                currentMedia.className = 'gallery-image'
                currentMedia.style.transform = 'translateX(0)'
                currentMedia.style.width = '400px'
                currentMedia.style.height = '400px'
            } else {
                currentMedia = document.createElement('img')
                currentMedia.src = ''
                setTimeout(function() {
                    currentMedia.src = currentSrc
                }, 0)
                currentMedia.className = 'gallery-image'
                currentMedia.style.transform = 'translateX(0)'
            }
            galleryViewport.appendChild(currentMedia)

            if (next !== null) {
                const nextSrc = galleryImages[next]
                let nextMedia
                if (nextSrc.endsWith('.mp4')) {
                    nextMedia = document.createElement('video')
                    nextMedia.src = nextSrc
                    nextMedia.autoplay = true
                    nextMedia.loop = true
                    nextMedia.muted = true
                    nextMedia.playsInline = true
                    nextMedia.className = 'gallery-image'
                    nextMedia.style.transform = direction === 'left' ? 'translateX(-400px)' : 'translateX(400px)'
                    nextMedia.style.width = '400px'
                    nextMedia.style.height = '400px'
                } else {
                    nextMedia = document.createElement('img')
                    nextMedia.src = ''
                    setTimeout(function() {
                        nextMedia.src = nextSrc
                    }, 0)
                    nextMedia.className = 'gallery-image'
                    nextMedia.style.transform = direction === 'left' ? 'translateX(-400px)' : 'translateX(400px)'
                }
                galleryViewport.appendChild(nextMedia)
                setTimeout(function() {
                    currentMedia.style.transform = direction === 'left' ? 'translateX(400px)' : 'translateX(-400px)'
                    nextMedia.style.transform = 'translateX(0)'
                }, 10)
                setTimeout(function() {
                    renderGallery(next, null, null)
                    updateIndicators()
                }, 500)
            }
        }

        function updateIndicators() {
            galleryIndicators.innerHTML = ''
            for (let i = 0; i < galleryImages.length; i++) {
                const ball = document.createElement('button')
                ball.className = 'gallery-ball' + (i === galleryIndex ? ' active' : '')
                ball.onclick = function() {
                    if (i !== galleryIndex) {
                        lastInteraction = Date.now()
                        renderGallery(galleryIndex, i, i < galleryIndex ? 'left' : 'right')
                        galleryIndex = i
                        if (autoScrollTimer) {
                            clearInterval(autoScrollTimer)
                            autoScrollTimer = null
                        }
                    }
                }
                galleryIndicators.appendChild(ball)
            }
        }

        function nextImage() {
            const nextIndex = (galleryIndex + 1) % galleryImages.length
            renderGallery(galleryIndex, nextIndex, 'right')
            galleryIndex = nextIndex
        }

        galleryIndicators.addEventListener('click', function() {
            lastInteraction = Date.now()
        })

        renderGallery(galleryIndex, null, null)
        updateIndicators()

        function startAutoScroll() {
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer)
            }
            autoScrollTimer = setInterval(function() {
                if (Date.now() - lastInteraction > 4000 && document.getElementById('tab-gallery').classList.contains('active')) {
                    nextImage()
                }
            }, 4000)
        }
        startAutoScroll()

local ReplicatedStorage = game:GetService("ReplicatedStorage")

local questHandler = {}
questHandler.quests = {}

local questRemotes = ReplicatedStorage:WaitForChild("QuestRemotes")
local questUpdateRemote = questRemotes:WaitForChild("QuestUpdate")
local questCompleteRemote = questRemotes:WaitForChild("QuestComplete")
local questDataRemote = questRemotes:WaitForChild("QuestData")

local questUI = require(script.Parent.QuestUI)

function questHandler.initialize()
    questUpdateRemote.OnClientEvent:Connect(function(questId, questData)
        questHandler.quests[questId] = questData
        questUI.updateQuest(questId, questData)
    end)

    questCompleteRemote.OnClientEvent:Connect(function(questId, rewards)
        questUI.showQuestComplete(questId, rewards)
        if (questHandler.quests[questId]) then
            questHandler.quests[questId].isCompleted = true
        end
    end)

    local success, questData = pcall(function()
        return questDataRemote:InvokeServer()
    end)

    if (success and questData) then
        questHandler.quests = questData
        questUI.initialize(questData)
    end
end

function questHandler.getQuests()
    return questHandler.quests
end

function questHandler.getActiveQuests()
    local activeQuests = {}
    for questId, quest in pairs(questHandler.quests) do
        if (not quest.isCompleted) then
            activeQuests[questId] = quest
        end
    end
    return activeQuests
end

questHandler.initialize()

return questHandler
`.trim()

local TweenService = game:GetService("TweenService")
local RunService = game:GetService("RunService")

local QuestUI = {}
QuestUI.isOpen = false
QuestUI.questFrames = {}

local questFrameModule = require(script.Parent.Parent.UI.elements.questframe)
local player = Players.LocalPlayer
local playerGui = player:WaitForChild("PlayerGui")

local PlayerListUI = require(script.Parent.Parent.PlayerList.PlayerListUI)

local mainScreenGui = Instance.new("ScreenGui")
mainScreenGui.Name = "QuestUI"
mainScreenGui.Parent = playerGui

local questContainer = Instance.new("ScrollingFrame")
questContainer.Size = UDim2.new(0, 320, 0, 400)
questContainer.Position = UDim2.new(0, math.max(0, workspace.CurrentCamera.ViewportSize.X - 320 - 20), 0.5, -200)
questContainer.BackgroundTransparency = 1
questContainer.BorderSizePixel = 0
questContainer.ScrollBarThickness = 6
questContainer.ScrollBarImageColor3 = Color3.fromRGB(100, 100, 100)
questContainer.CanvasSize = UDim2.new(0, 0, 0, 0)
questContainer.Parent = mainScreenGui

local questLayout = Instance.new("UIListLayout")
questLayout.SortOrder = Enum.SortOrder.LayoutOrder
questLayout.Padding = UDim.new(0, 10)

local function calculateQuestFrameSize()
    return UDim2.new(0, 320, 0, 400)
end

local function getQuestContainerX()
    local viewportSize = workspace.CurrentCamera.ViewportSize
    local frameSize = calculateQuestFrameSize()
    return math.max(0, viewportSize.X - frameSize.X.Offset - 20)
end

local function updateQuestContainerX()
    local newPosX = getQuestContainerX()
    local currentPos = questContainer.Position
    questContainer.Position = UDim2.new(0, newPosX, currentPos.Y.Scale, currentPos.Y.Offset)
end

workspace.CurrentCamera:GetPropertyChangedSignal("ViewportSize"):Connect(function()
    updateQuestContainerX()
end)

local function updateQuestContainerPosition()
    local newPosX = getQuestContainerX()
    local targetY
    if (PlayerListUI.IsVisible()) then
        local playerListHeight = 0
        local playerGui = player:WaitForChild("PlayerGui")
        local customPlayerList = playerGui:FindFirstChild("CustomPlayerList")
        if (customPlayerList) then
            local frameObject = customPlayerList:FindFirstChildOfClass("Frame")
            if (frameObject) then
                playerListHeight = frameObject.AbsoluteSize.Y
            end
        end
        targetY = 5 + playerListHeight
    else
        targetY = 50
    end
    local targetPosition = UDim2.new(0, newPosX, 0, targetY)
    local tweenInfo = TweenInfo.new(0.3, Enum.EasingStyle.Quart, Enum.EasingDirection.Out)
    local positionTween = TweenService:Create(questContainer, tweenInfo, {Position = targetPosition})
    positionTween:Play()
end

local positionUpdateConnection = RunService.Heartbeat:Connect(function()
    if (PlayerListUI and PlayerListUI.IsVisible) then
        local isPlayerListVisible = PlayerListUI.IsVisible()
        local newPosX = getQuestContainerX()
        local targetY
        if (isPlayerListVisible) then
            local playerListHeight = 0
            local playerGui = player:WaitForChild("PlayerGui")
            local customPlayerList = playerGui:FindFirstChild("CustomPlayerList")
            if (customPlayerList) then
                local frameObject = customPlayerList:FindFirstChildOfClass("Frame")
                if (frameObject) then
                    playerListHeight = frameObject.AbsoluteSize.Y
                end
            end
            targetY = 5 + playerListHeight
        else
            targetY = 50
        end
        local currentY = questContainer.Position.Y.Offset
        if (math.abs(currentY - targetY) > 5 or questContainer.Position.X.Offset ~= newPosX) then
            local targetPosition = UDim2.new(0, newPosX, 0, targetY)
            local tweenInfo = TweenInfo.new(0.3, Enum.EasingStyle.Quart, Enum.EasingDirection.Out)

function QuestUI:Initialize(questData)
    for questId, quest in pairs(questData) do
        if (not quest.isCompleted) then
            self:CreateQuestFrame(questId, quest)
        end
    end
    self:UpdateLayout()
    updateQuestContainerPosition()
end

function QuestUI:CreateQuestFrame(questId, questData)
    if (self.questFrames[questId]) then
        self.questFrames[questId].frameObject.frame:Destroy()
    end

    local frameObject = questFrameModule.create(questContainer, UDim2.new(1, -20, 0, 100))
    frameObject.frame.Position = UDim2.new(0, 10, 0, 0)

    local titleLabel = Instance.new("TextLabel")
    titleLabel.Size = UDim2.new(1, -20, 0, 25)
    titleLabel.Position = UDim2.new(0, 10, 0, 5)
    titleLabel.BackgroundTransparency = 1
    titleLabel.Text = questData.title
    titleLabel.TextColor3 = Color3.fromRGB(255, 255, 255)
    titleLabel.TextScaled = true
    titleLabel.Font = Enum.Font.SourceSansBold
    titleLabel.TextXAlignment = Enum.TextXAlignment.Left
    titleLabel.Parent = frameObject.frame

    local currentStage = questData.stages[questData.currentStage]
    local progressText = ""
    if (currentStage) then
        progressText = currentStage.description .. " (" .. currentStage.current .. "/" .. currentStage.target .. ")"
    end

    local progressLabel = Instance.new("TextLabel")
    progressLabel.Size = UDim2.new(1, -20, 0, 20)
    progressLabel.Position = UDim2.new(0, 10, 0, 30)
    progressLabel.BackgroundTransparency = 1
    progressLabel.Text = progressText
    progressLabel.TextColor3 = Color3.fromRGB(200, 200, 200)
    progressLabel.TextScaled = true
    progressLabel.Font = Enum.Font.SourceSans
    progressLabel.TextXAlignment = Enum.TextXAlignment.Left
    progressLabel.Parent = frameObject.frame

    local progressBarBG = Instance.new("Frame")
    progressBarBG.Size = UDim2.new(1, -20, 0, 8)
    progressBarBG.Position = UDim2.new(0, 10, 0, 55)
    progressBarBG.BackgroundColor3 = Color3.fromRGB(50, 50, 50)
    progressBarBG.BorderSizePixel = 0
    progressBarBG.Parent = frameObject.frame

    local progressBarFill = Instance.new("Frame")
    progressBarFill.Size = UDim2.new(0, 0, 1, 0)
    progressBarFill.Position = UDim2.new(0, 0, 0, 0)
    progressBarFill.BackgroundColor3 = Color3.fromRGB(76, 250, 105)
    progressBarFill.BorderSizePixel = 0
    progressBarFill.Parent = progressBarBG

    if (currentStage and currentStage.target > 0) then
        local progressRatio = currentStage.current / currentStage.target
        progressBarFill.Size = UDim2.new(progressRatio, 0, 1, 0)
    end

    self.questFrames[questId] = {
        frameObject = frameObject,
        titleLabel = titleLabel,
        progressLabel = progressLabel,
        progressBarFill = progressBarFill,
        questData = questData
    }

    questFrameModule.animateOpen(frameObject)
    updateQuestContainerPosition()
end

function QuestUI:UpdateQuest(questId, questData)
    if (not self.questFrames[questId]) then
        self:CreateQuestFrame(questId, questData)
        return
    end

    local questFrame = self.questFrames[questId]
    questFrame.questData = questData

    questFrame.titleLabel.Text = questData.title

    local currentStage = questData.stages[questData.currentStage]
    if (currentStage) then
        local progressText = currentStage.description .. " (" .. currentStage.current .. "/" .. currentStage.target .. ")"
        questFrame.progressLabel.Text = progressText

        local progressRatio = currentStage.current / currentStage.target
        local targetSize = UDim2.new(progressRatio, 0, 1, 0)

        local tweenInfo = TweenInfo.new(0.5, Enum.EasingStyle.Quart, Enum.EasingDirection.Out)
        local progressTween = TweenService:Create(questFrame.progressBarFill, tweenInfo, {Size = targetSize})
        progressTween:Play()
    end

    if (questData.isCompleted) then
        task.wait(2)
        self:RemoveQuestFrame(questId)
    end
end

function QuestUI:ShowQuestComplete(questId, rewards)
    print("Quest completed:", questId)
end

function QuestUI:RemoveQuestFrame(questId)
    if (self.questFrames[questId]) then
        local questFrame = self.questFrames[questId]
        questFrameModule.animateClose(questFrame.frameObject)
        self.questFrames[questId] = nil
        self:UpdateLayout()
        updateQuestContainerPosition()
    end
end

function QuestUI:UpdateLayout()
    local totalHeight = 0

    for _, questFrame in pairs(self.questFrames) do
        totalHeight = totalHeight + 110
    end

    questContainer.CanvasSize = UDim2.new(0, 0, 0, totalHeight)
end

return QuestUI`.trim()

        const codeContainer = document.getElementById('codeContainer')
        const codeViewerFuncs = document.getElementById('codeViewerFuncs')

        function showPrivatePopup() {
            if (document.getElementById('privatePopup')) return

            overlay.id = 'privatePopup'
            overlay.innerHTML = `
                <div class="popup-box">

                    <br>
                    <button onclick="document.getElementById('privatePopup').remove()">Close</button>
                </div>
            `
            document.body.appendChild(overlay)

        function renderCodeTabs() {
            codeViewerTabs.innerHTML = ''
            codeFiles.forEach((file, idx) => {
                const btn = document.createElement('button')
                btn.className = 'code-viewer-tab' + (idx === currentCodeFile ? ' active' : '')
                btn.textContent = file.name + ` (${file.lines} lines)`
                if (file.realm) {
                    const realmSpan = document.createElement('span')
                    realmSpan.textContent = ` (${file.realm})`
                    realmSpan.style.fontSize = '0.95em'
                    realmSpan.style.color = '#bd93f9'
                    realmSpan.style.marginLeft = '6px'
                    btn.appendChild(realmSpan)
                }
                if (file.private) {
                    btn.classList.add('locked')
                    btn.onclick = function(e) {
                        e.preventDefault()
                        showPrivatePopup()
                    }
                } else {
                    btn.onclick = function() {
                        if (currentCodeFile !== idx) {
                            currentCodeFile = idx
                            renderCode()
                            renderCodeTabs()
                            renderFuncList()
                        }
                    }
                }
                codeViewerTabs.appendChild(btn)
            })
        }

        function highlightLuau(code) {
            const keywords = /\b(local|function|return|if|then|end|not|and|or)\b/g
            const strings = /(["'])(?:(?=(\\?))\2.)*?\1/g
            const numbers = /\b\d+(\.\d+)?\b/g

            let html = code
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')

            html = html.replace(strings, m => `<span class="code-highlight-string">${m}</span>`)
            html = html.replace(keywords, m => `<span class="code-highlight-keyword">${m}</span>`)
            html = html.replace(numbers, m => `<span class="code-highlight-number">${m}</span>`)

            return html
        }

        function renderCode() {
            const file = codeFiles[currentCodeFile]
            const lines = file.content.split('\n')

            codeContainer.innerHTML = ''

            const containerStyles = window.getComputedStyle(codeContainer)
            const minHeight = parseInt(containerStyles.minHeight)
            const maxHeight = parseInt(containerStyles.maxHeight)
            let containerHeight = codeContainer.offsetHeight
            if (containerHeight < minHeight) containerHeight = minHeight
            if (containerHeight > maxHeight) containerHeight = maxHeight

            const codeWrapper = document.createElement('div')
            codeWrapper.style.display = 'flex'
            codeWrapper.style.width = '100%'
            codeWrapper.style.height = '100%'
            codeWrapper.style.position = 'relative'

            const codeLines = document.createElement('div')
            codeLines.className = 'code-lines'
            codeLines.style.flex = 'none'
            codeLines.style.overflow = 'hidden'
            codeLines.style.display = 'block'
            codeLines.style.boxSizing = 'border-box'
            codeLines.style.height = '100%'
            codeLines.innerHTML = lines.map((_, i) => i + 1).join('<br>')

            const codeContent = document.createElement('div')
            codeContent.className = 'code-content'
            codeContent.style.height = '100%'
            codeContent.style.overflowY = 'auto'
            codeContent.style.flex = '1'
            codeContent.style.boxSizing = 'border-box'
            codeContent.style.background = '#23272a'
            codeContent.style.display = 'flex'
            codeContent.style.flexDirection = 'column'
            codeContent.style.justifyContent = 'stretch'
            codeContent.innerHTML = `<pre style="margin:0;white-space:pre-wrap;word-break:break-word; height:100%; display:flex; flex-direction:column; justify-content:stretch;"><code class="hljs" style="flex:1;">${highlightLuau(file.content)}</code></pre>`

            codeWrapper.appendChild(codeLines)
            codeWrapper.appendChild(codeContent)

            codeContainer.appendChild(codeWrapper)

            codeContent.onscroll = function() {
                codeLines.scrollTop = codeContent.scrollTop
            }
        }

        function getFunctions(code) {
            const funcRegex = /function\s+([a-zA-Z_][\w]*)\s*\(([^)]*)\)/g
            const lines = code.split('\n')
            let match, funcs = []
            while ((match = funcRegex.exec(code)) !== null) {
                let lineNum = 0
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes(match[0])) {
                        lineNum = i
                        break
                    }
                }
                funcs.push({
                    name: match[1],
                    params: match[2],
                    line: lineNum
                })
            }
            return funcs
        }

        function renderFuncList() {
            const file = codeFiles[currentCodeFile]
            const funcs = getFunctions(file.content)
            codeViewerFuncs.innerHTML = ''
            funcs.forEach(func => {
                const div = document.createElement('div')
                div.style.cursor = 'pointer'
                div.style.marginBottom = '10px'
                div.innerHTML = `<span class="code-highlight-func">${func.name}</span><span class="code-highlight-param">(${func.params})</span>`
                div.onclick = function() {
                    const codeContent = codeContainer.querySelector('.code-content')
                    const codeLines = codeContainer.querySelector('.code-lines')
                    const lineHeight = codeContent.scrollHeight / codeContent.innerText.split('\n').length
                    codeContent.scrollTop = func.line * lineHeight
                    codeLines.scrollTop = func.line * lineHeight
                }
                codeViewerFuncs.appendChild(div)
            })
        }

        renderCodeTabs()
        renderCode()
        renderFuncList()
    </script>
</body>
</html>
