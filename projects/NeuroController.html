    <script>
        const tabs = document.querySelectorAll('.tab-btn')
        const tabContents = document.querySelectorAll('.tab-content')
        tabs.forEach(tab => {
            tab.onclick = function() {
                tabs.forEach(t => t.classList.remove('active'))
                tabContents.forEach(c => c.classList.remove('active'))
                tab.classList.add('active')
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active')
                if (tab.dataset.tab === 'gallery') {
                    startAutoScroll()
                } else {
                    if (autoScrollTimer) {
                        clearInterval(autoScrollTimer)
                        autoScrollTimer = null
                    }
                }
            }
        })

        const galleryImages = [
            '../assets/images/NeuroController.png'
        ]
        let galleryIndex = 0
        let autoScrollTimer = null
        let lastInteraction = Date.now()
        const galleryViewport = document.getElementById('galleryViewport')
        const galleryIndicators = document.getElementById('galleryIndicators')

        function renderGallery(current, next, direction) {
            galleryViewport.innerHTML = ''
            const currentSrc = galleryImages[current]
            let currentMedia
            if (currentSrc.endsWith('.mp4')) {
                currentMedia = document.createElement('video')
                currentMedia.src = currentSrc
                currentMedia.autoplay = true
                currentMedia.loop = true
                currentMedia.muted = true
                currentMedia.playsInline = true
                currentMedia.className = 'gallery-image'
                currentMedia.style.transform = 'translateX(0)'
                currentMedia.style.width = '400px'
                currentMedia.style.height = '400px'
            } else {
                currentMedia = document.createElement('img')
                currentMedia.src = ''
                setTimeout(function() {
                    currentMedia.src = currentSrc
                }, 0)
                currentMedia.className = 'gallery-image'
                currentMedia.style.transform = 'translateX(0)'
            }
            galleryViewport.appendChild(currentMedia)

            if (next !== null) {
                const nextSrc = galleryImages[next]
                let nextMedia
                if (nextSrc.endsWith('.mp4')) {
                    nextMedia = document.createElement('video')
                    nextMedia.src = nextSrc
                    nextMedia.autoplay = true
                    nextMedia.loop = true
                    nextMedia.muted = true
                    nextMedia.playsInline = true
                    nextMedia.className = 'gallery-image'
                    nextMedia.style.transform = direction === 'left' ? 'translateX(-400px)' : 'translateX(400px)'
                    nextMedia.style.width = '400px'
                    nextMedia.style.height = '400px'
                } else {
                    nextMedia = document.createElement('img')
                    nextMedia.src = ''
                    setTimeout(function() {
                        nextMedia.src = nextSrc
                    }, 0)
                    nextMedia.className = 'gallery-image'
                    nextMedia.style.transform = direction === 'left' ? 'translateX(-400px)' : 'translateX(400px)'
                }
                galleryViewport.appendChild(nextMedia)
                setTimeout(function() {
                    currentMedia.style.transform = direction === 'left' ? 'translateX(400px)' : 'translateX(-400px)'
                    nextMedia.style.transform = 'translateX(0)'
                }, 10)
                setTimeout(function() {
                    renderGallery(next, null, null)
                    updateIndicators()
                }, 500)
            }
        }

        function updateIndicators() {
            galleryIndicators.innerHTML = ''
            for (let i = 0; i < galleryImages.length; i++) {
                const ball = document.createElement('button')
                ball.className = 'gallery-ball' + (i === galleryIndex ? ' active' : '')
                ball.onclick = function() {
                    if (i !== galleryIndex) {
                        lastInteraction = Date.now()
                        renderGallery(galleryIndex, i, i < galleryIndex ? 'left' : 'right')
                        galleryIndex = i
                        if (autoScrollTimer) {
                            clearInterval(autoScrollTimer)
                            autoScrollTimer = null
                        }
                    }
                }
                galleryIndicators.appendChild(ball)
            }
        }

        function nextImage() {
            const nextIndex = (galleryIndex + 1) % galleryImages.length
            renderGallery(galleryIndex, nextIndex, 'right')
            galleryIndex = nextIndex
        }

        galleryIndicators.addEventListener('click', function() {
            lastInteraction = Date.now()
        })

        renderGallery(galleryIndex, null, null)
        updateIndicators()

        function startAutoScroll() {
            if (autoScrollTimer) {
                clearInterval(autoScrollTimer)
            }
            autoScrollTimer = setInterval(function() {
                if (Date.now() - lastInteraction > 4000 && document.getElementById('tab-gallery').classList.contains('active')) {
                    nextImage()
                }
            }, 4000)
        }
        startAutoScroll()

-- Registers an SCP for neuro control capabilities.
--
-- This function adds an SCP to the neurocontroller system, allowing players with
-- appropriate access to establish neural control over SCPs. The difficulty parameter
-- determines how challenging it is to control this particular SCP.
--
-- @tparam string scp The unique identifier for the SCP
-- @tparam number difficulty Control difficulty level (NeuroController.DIFFICULTY.EASY/MODERATE/HARD)
-- @tparam function onNeuro Function called when neural control finished
-- @tparam table actions Table of additional commands that can be issued to the controlled SCP
function NeuroController.Config.RegisterSCPNeuro(scp, difficulty, onNeuro, actions)
    if (not scp or not isstring(scp)) then
        return
    end

    if (not difficulty or not isnumber(difficulty) or difficulty < NeuroController.DIFFICULTY.EASY) then
        return
    end

    local finalOnNeuro
    if (onNeuro and isfunction(onNeuro)) then
        finalOnNeuro = function(ply, scp)
            healSCPOnNeuro(ply, scp)
            onNeuro(ply, scp)
        end
    else
        finalOnNeuro = healSCPOnNeuro
    end

    local SCPActions = table.Copy(NeuroController.Config.DefaultActions or {})

    if (actions and istable(actions)) then
        for cmd, fn in pairs(actions) do
            SCPActions[cmd] = fn
        end
    end

    NeuroController.Config.SCPNeuro[scp] = {
        difficulty = difficulty,
        onNeuro = finalOnNeuro,
        actions = SCPActions
    }

    NeuroController.Print("NeuroController Registered SCP: " .. scp)
end

    if (not IsValid(ply)) then
        return false
    end
    if (not ply:Alive()) then

        net.WriteBool(true)
        net.Send(ply)
    end
    return true
end

function NeuroController.RemoveNeuroController(ply)
    if (not IsValid(ply)) then
        return false
    end
    if (not ply:GetNWBool("NeuroController")) then
        return false, "You dont have a NeuroController"

    local reason = ""
    local shouldPrevent = hook.Run("ShouldNeuroControllerRemove", ply, reason)
    if (shouldPrevent) then

function NeuroController.Hud.WrapText(text, font, maxWidth)
    local output = ""
    local lineWidth = 0
    local spaceWidth = 0

    surface.SetFont(font)
    spaceWidth = surface.GetTextSize(" ")

    local lines = string.Explode("\n", text)
    for l, line in ipairs(lines) do
        if (l > 1) then
            output = output .. "\n"
        end

        local words = string.Explode(" ", line)
        local currentLine = ""
        lineWidth = 0

        for i, word in ipairs(words) do
            local wordWidth = surface.GetTextSize(word)

            if (lineWidth + wordWidth <= maxWidth) then
                if (lineWidth > 0) then
                    currentLine = currentLine .. " "
                    lineWidth = lineWidth + spaceWidth
                end

                currentLine = currentLine .. word
                lineWidth = lineWidth + wordWidth
            else
                if (currentLine != "") then
                    output = output .. currentLine .. "\n"
                    currentLine = word
                    lineWidth = wordWidth
                else
                    output = output .. word .. "\n"
                    currentLine = ""
                    lineWidth = 0
                end
            end
        end

        if (currentLine != "") then
            output = output .. currentLine
        end
    end

    return output
end

function NeuroController.Hud.LerpValue(name, target, duration)
    if (not duration or duration <= 0) then
        return target
    end

    NeuroController.Hud.Transitions[name] = NeuroController.Hud.Transitions[name] or {}
    local t = NeuroController.Hud.Transitions[name]

    t.target = target
    t.start = NeuroController.Hud[name]
    t.startTime = CurTime()
    t.duration = duration

    return NeuroController.Hud[name]
end

function NeuroController.Hud.UpdateLerps()
    local currentTime = CurTime()

    for name, t in pairs(NeuroController.Hud.Transitions) do
        if (t.startTime and t.duration) then
            local elapsed = currentTime - t.startTime
            local progress = math.Clamp(elapsed / t.duration, 0, 1)

            if (type(t.start) == "number") then
                if (name == "LineCount") then
                    NeuroController.Hud[name] = math.Round(Lerp(progress, t.start, t.target))
                else
                    NeuroController.Hud[name] = Lerp(progress, t.start, t.target)
                end
            elseif (t.start.r) then
                NeuroController.Hud[name] = Color(
                    Lerp(progress, t.start.r, t.target.r),
                    Lerp(progress, t.start.g, t.target.g),
                    Lerp(progress, t.start.b, t.target.b),
                    Lerp(progress, t.start.a, t.target.a)
                )
            end

            if (progress >= 1) then
                t.startTime = nil
                t.duration = nil
            end
        end
    end
end

function NeuroController.Hud.UpdateScanningBeams(entity)
    if (not IsValid(entity)) then
        return
    end

    local ct = CurTime()

    for i = #NeuroController.Hud.BeamLines, 1, -1 do
        if (ct > NeuroController.Hud.BeamLines[i].endTime) then
            table.remove(NeuroController.Hud.BeamLines, i)
        end
    end

    local mins, maxs = entity:OBBMins(), entity:OBBMaxs()

    while (#NeuroController.Hud.BeamLines < NeuroController.Hud.ActiveBeams) do
        local lineIndex = math.random(1, NeuroController.Hud.LineCount)

        local scale = 0.8
        local randomOffset = Vector(
            math.Rand(mins.x, maxs.x) * scale,
            math.Rand(mins.y, maxs.y) * scale,
            math.Rand(mins.z, maxs.z) * scale
        )

        table.insert(NeuroController.Hud.BeamLines, {
            lineIndex = lineIndex,
            targetEntity = entity,
            targetOffset = randomOffset,
            startTime = ct,
            endTime = ct + NeuroController.Hud.BeamLifetime
        })
    end
end

function NeuroController.Hud.GetEntityLookedAt()
    local ply = LocalPlayer()
    if (not IsValid(ply)) then
        return
    end

    if (not NeuroController.Scanner) then
        return
    end

    local viewPos = ply:EyePos()
    local viewVector = ply:GetAimVector()
    local maxDistance = 600
    local dotThreshold = 0.97
    local bestEntity = nil
    local bestDot = dotThreshold

    local trace = {
        start = viewPos,
        endpos = viewPos + viewVector * maxDistance,
        filter = ply
    }

    local tr = util.TraceLine(trace)

    if (tr.Hit and IsValid(tr.Entity)) then
        bestEntity = tr.Entity
    else
        local highlightedEntities = NeuroController.Scanner.HighlightedEntities
        if (highlightedEntities) then
            for _, entData in pairs(highlightedEntities) do
                if (not IsValid(entData.entity)) then
                    continue
                end

                local entity = entData.entity
                local entityPos = entity:GetPos() + entity:OBBCenter()
                local entityDistance = entityPos:Distance(viewPos)

                if (entityDistance > maxDistance) then
                    continue
                end

                local entityDir = (entityPos - viewPos):GetNormalized()

                local dot = viewVector:Dot(entityDir)

                if (dot > bestDot) then
                    local visTrace = {
                        start = viewPos,
                        endpos = entityPos,
                        filter = ply
                    }

                    local visResult = util.TraceLine(visTrace)
                    if (visResult.Entity == entity or not visResult.Hit) then
                        bestDot = dot
                        bestEntity = entity
                    end
                end
            end
        end

        local highlightedPlayers = NeuroController.Scanner.HighlightedPlayers
        if (highlightedPlayers) then
            for steamID, playerData in pairs(highlightedPlayers) do
                local entity = playerData.player
                if (not IsValid(entity)) then
                    continue
                end

                local entityPos = entity:GetPos() + Vector(0, 0, 40)
                local entityDistance = entityPos:Distance(viewPos)

                if (entityDistance > maxDistance) then
                    continue
                end

                local entityDir = (entityPos - viewPos):GetNormalized()

                local dot = viewVector:Dot(entityDir)

                if (dot > bestDot) then
                    local visTrace = {
                        start = viewPos,
                        endpos = entityPos,
                        filter = ply
                    }

                    local visResult = util.TraceLine(visTrace)
                    if (visResult.Entity == entity or not visResult.Hit) then
                        bestDot = dot
                        bestEntity = entity
                    end
                end
            end
        end
    end

    return bestEntity
end

function NeuroController.Hud.SetProgressActive(active, speed, color)
    NeuroController.Hud.ProgressActive = active or false

    if (active) then
        NeuroController.Hud.ProgressSpeed = speed or 5

        if (color) then
            NeuroController.Hud.ProgressColor = Color(color.r, color.g, color.b, color.a or 200)
        end

        NeuroController.Hud.ProgressValue = 0
    end
end

function NeuroController.Hud.UpdateProgress()
    if (not NeuroController.Hud.ProgressActive) then
        return
    end

    local frameTime = FrameTime()

    if (NeuroController.Hud.ProgressValue < NeuroController.Hud.LineCount) then
        NeuroController.Hud.ProgressValue = NeuroController.Hud.ProgressValue + (NeuroController.Hud.ProgressSpeed * frameTime)

        if (NeuroController.Hud.ProgressValue > NeuroController.Hud.LineCount) then
            NeuroController.Hud.ProgressValue = NeuroController.Hud.LineCount
        end
    end
end

function NeuroController.Hud.IsLineInProgress(lineIndex)
    if (not NeuroController.Hud.ProgressActive) then
        return false
    end

    return lineIndex <= math.floor(NeuroController.Hud.ProgressValue)
end

function NeuroController.Hud.GetLineColor(lineIndex)
    if (NeuroController.Hud.IsLineInProgress(lineIndex)) then
        return NeuroController.Hud.ProgressColor
    else
        return NeuroController.Hud.LineColor
    end
end

NeuroController.Hud.Decryption = {
    Title = {text = "", progress = 0, complete = false},
    Description = {text = "", progress = 0, complete = false},
    Details = {},
    WordDelay = 0.15,
    CharDelay = 0.02,
    LastWordTime = 0,
    LastCharTime = 0,
    CurrentWord = 1,
    CurrentChar = 1,
    Words = {},
    SpecialChars = {"$", "%", "£", "&", "#", "@", "!", "?", "*", "~", "^", "+", "=", ":", ";", "<", ">", "{", "}", "[", "]", "(", ")", "_", "-", "|", "\\", "/"}

function NeuroController.Hud.InitDecryption(entity)
    if (not IsValid(entity)) then
        return
    end

    if (not NeuroController.Scanner) then
        return
    end

    local entID = entity:EntIndex()

    if (NeuroController.Hud.EntityDecryptionProgress[entID]) then
        local savedProgress = NeuroController.Hud.EntityDecryptionProgress[entID]

        NeuroController.Hud.Decryption.Title = table.Copy(savedProgress.Title)
        NeuroController.Hud.Decryption.Description = table.Copy(savedProgress.Description)
        NeuroController.Hud.Decryption.Details = table.Copy(savedProgress.Details)

        NeuroController.Hud.Decryption.LastWordTime = 0
        NeuroController.Hud.Decryption.LastCharTime = 0
        return
    end

    NeuroController.Hud.ResetDecryption()

    local info = NeuroController.Scanner.GetEntityInfo(entity)
    if (not info) then
        return
    end

    local d = NeuroController.Hud.Decryption
    local specialChars = d.SpecialChars

    local titleWords = string.Explode(" ", info.title)
    d.Title.text = ""
    for i, word in ipairs(titleWords) do
        if (i > 1) then
            d.Title.text = d.Title.text .. " "
        end
        local scrambled = ""
        for j = 1, #word do
            scrambled = scrambled .. specialChars[math.random(1, #specialChars)]
        end
        d.Title.text = d.Title.text .. scrambled
    end
    d.Title.originalText = info.title
    d.Title.decryptLevel = 0

    local lines = string.Explode("\n", info.description)
    d.Description.text = ""

    for lineNum, line in ipairs(lines) do
        if (lineNum > 1) then
            d.Description.text = d.Description.text .. "\n"
        end

        local lineWords = string.Explode(" ", line)
        local lineScrambled = ""

        for i, word in ipairs(lineWords) do
            if (i > 1) then
                lineScrambled = lineScrambled .. " "
            end
            local wordScrambled = ""
            for j = 1, #word do
                wordScrambled = wordScrambled .. specialChars[math.random(1, #specialChars)]
            end
            lineScrambled = lineScrambled .. wordScrambled
        end

        local charCount = 0
        local formattedLine = ""

        for i = 1, #lineScrambled do
            formattedLine = formattedLine .. string.sub(lineScrambled, i, i)
            charCount = charCount + 1

            if (string.sub(lineScrambled, i, i) == " " and charCount > 40) then
                formattedLine = formattedLine .. "\n"
                charCount = 0
            end
        end

        d.Description.text = d.Description.text .. formattedLine
    end

    d.Description.originalText = info.description
    d.Description.decryptLevel = 0

    d.Details = {}
    for k, v in pairs(info.details) do
        local detailKey = k
        local detailValue = tostring(v)

        local keyScrambled = ""
        for j = 1, #detailKey do
            keyScrambled = keyScrambled .. specialChars[math.random(1, #specialChars)]
        end

        local valueScrambled = ""
        local valueLines = string.Explode("\n", detailValue)

        for lineNum, line in ipairs(valueLines) do
            if (lineNum > 1) then
                valueScrambled = valueScrambled .. "\n"
            end

            local lineWords = string.Explode(" ", line)
            local lineValue = ""

            for i, word in ipairs(lineWords) do
                if (i > 1) then
                    lineValue = lineValue .. " "
                end
                local wordScrambled = ""
                for j = 1, #word do
                    wordScrambled = wordScrambled .. specialChars[math.random(1, #specialChars)]
                end
                lineValue = lineValue .. wordScrambled
            end

            valueScrambled = valueScrambled .. lineValue
        end

        d.Details[k] = {
            key = keyScrambled .. ":",
            value = valueScrambled,
            originalKey = detailKey .. ":",
            originalValue = detailValue,
            keyDecryptLevel = 0,
            valueDecryptLevel = 0
        }
    end
end

function NeuroController.Hud.UpdateDecryption()
    local d = NeuroController.Hud.Decryption
    local ct = CurTime()

    if (ct < d.LastCharTime + d.CharDelay) then
        return
    end

    d.LastCharTime = ct

    local stillDecrypting = false

    if (d.Title.decryptLevel < 1) then
        d.Title.decryptLevel = math.min(1, d.Title.decryptLevel + 0.02)
        d.Title.text = NeuroController.Hud.GeneratePartialDecryptedText(d.Title.originalText, d.Title.decryptLevel)
        stillDecrypting = true
    end

    if (d.Description.decryptLevel < 1) then
        d.Description.decryptLevel = math.min(1, d.Description.decryptLevel + 0.01)
        d.Description.text = NeuroController.Hud.GeneratePartialDecryptedText(d.Description.originalText, d.Description.decryptLevel)
        stillDecrypting = true
    end

    for k, detail in pairs(d.Details) do
        if (detail.keyDecryptLevel < 1) then
            detail.keyDecryptLevel = math.min(1, detail.keyDecryptLevel + 0.02)
            detail.key = NeuroController.Hud.GeneratePartialDecryptedText(detail.originalKey, detail.keyDecryptLevel)
            stillDecrypting = true
        end

        if (detail.valueDecryptLevel < 1) then
            detail.valueDecryptLevel = math.min(1, detail.valueDecryptLevel + 0.01)
            detail.value = NeuroController.Hud.GeneratePartialDecryptedText(detail.originalValue, detail.valueDecryptLevel)
            stillDecrypting = true
        end
    end

    if (stillDecrypting and IsValid(NeuroController.Hud.LastTargetent)) then
        local entID = NeuroController.Hud.LastTargetent:EntIndex()
        NeuroController.Hud.EntityDecryptionProgress[entID] = {
            Title = table.Copy(d.Title),
            Description = table.Copy(d.Description),
            Details = table.Copy(d.Details)
        }
    end
end

function NeuroController.Hud.GeneratePartialDecryptedText(originalText, decryptLevel)
    local d = NeuroController.Hud.Decryption
    local specialChars = d.SpecialChars
    local result = ""

    local lines = string.Explode("\n", originalText)

    for lineNum, line in ipairs(lines) do
        if (lineNum > 1) then
            result = result .. "\n"
        end

        local lineResult = ""
        local decryptedChars = math.floor(#line * decryptLevel)

        local positions = {}
        for i = 1, #line do
            table.insert(positions, i)
        end

        for i = #positions, 2, -1 do
            local j = math.random(i)
            positions[i], positions[j] = positions[j], positions[i]
        end

        local decryptedPositions = {}
        for i = 1, decryptedChars do
            decryptedPositions[positions[i]] = true
        end

        for i = 1, #line do
            local char = string.sub(line, i, i)
            if (char == " ") then
                lineResult = lineResult .. " "
            elseif (decryptedPositions[i]) then
                lineResult = lineResult .. char
            else
                lineResult = lineResult .. specialChars[math.random(1, #specialChars)]
            end
        end

        result = result .. lineResult
    end

    return result
end

function NeuroController.Hud.ResetDecryption()
    local d = NeuroController.Hud.Decryption
    d.Title = {text = "", originalText = "", decryptLevel = 0}
    d.Description = {text = "", originalText = "", decryptLevel = 0}
    d.Details = {}
    d.LastWordTime = 0
    d.LastCharTime = 0
end

function NeuroController.Hud.StartSkillCheck(target, difficulty)
    local ply = LocalPlayer()
    if (not IsValid(ply) or not IsValid(target)) then
        return
    end

    local skillCheck = NeuroController.Hud.SkillCheck
    skillCheck.Active = true
    skillCheck.Target = target
    skillCheck.Difficulty = difficulty
    skillCheck.ProgressFactor = 0
    skillCheck.NoiseOffset = math.random() * 10
    skillCheck.LastUpdateTime = CurTime()

    local eyeAngles = ply:EyeAngles()
    skillCheck.CurrentTargetYaw = eyeAngles.y
    skillCheck.CurrentTargetPitch = eyeAngles.p
end

function NeuroController.Hud.StopSkillCheck()
    NeuroController.Hud.SkillCheck.Active = false
    NeuroController.Hud.SkillCheck.Target = nil
end

function NeuroController.Hud.UpdateSkillCheck(target, progressFactor, awayAngles, difficulty)
    local skillCheck = NeuroController.Hud.SkillCheck

    skillCheck.Target = target
    skillCheck.ProgressFactor = progressFactor
    skillCheck.AwayAngles = awayAngles
    skillCheck.Difficulty = difficulty
    skillCheck.LastUpdateTime = CurTime()
end

function NeuroController.Hud.ProcessSkillCheck()
    local skillCheck = NeuroController.Hud.SkillCheck
    if (not skillCheck.Active) then
        return
    end

    local ply = LocalPlayer()
    if (not IsValid(ply) or not IsValid(skillCheck.Target)) then
        return
    end

    local curTime = CurTime()
    local deltaTime = curTime - skillCheck.LastUpdateTime
    skillCheck.LastUpdateTime = curTime

    local baseYawStrength = 0
    if (skillCheck.Difficulty == 1) then
        baseYawStrength = 0.03 + (skillCheck.ProgressFactor * 0.04)
    elseif (skillCheck.Difficulty == 2) then
        baseYawStrength = 0.05 + (skillCheck.ProgressFactor * 0.06)
    else
        baseYawStrength = 0.1 + (skillCheck.ProgressFactor * 0.08)
    end

    local basePitchStrength = baseYawStrength * 0.25

    skillCheck.NoiseOffset = skillCheck.NoiseOffset + deltaTime * 0.8

    local randomYawDeviation = math.sin(skillCheck.NoiseOffset) * 0.02 + math.sin(skillCheck.NoiseOffset * 0.3) * 0.015
    local randomPitchDeviation = math.sin(skillCheck.NoiseOffset * 0.7) * 0.01

    local currentAngles = ply:EyeAngles()

    local eyePos = ply:EyePos()
    local targetPos = skillCheck.Target:GetPos() + Vector(0, 0, 40)
    local directionToTarget = (targetPos - eyePos):GetNormalized()
    local directionAwayFromTarget = -directionToTarget
    local idealYaw = directionAwayFromTarget:Angle().y

    local lookingAtTarget = ply:GetAimVector():Dot(directionToTarget)
    local pushFactor = math.Clamp(lookingAtTarget * 1.5, 0.1, 1.0)

    local yawDiff = math.AngleDifference(idealYaw, currentAngles.y)
    local yawDirection = (yawDiff > 0) and 1 or -1
    local minPush = baseYawStrength * 0.3 * yawDirection

    local yawChange = (yawDiff * 0.05) + randomYawDeviation + minPush

    yawChange = math.Clamp(yawChange * pushFactor, -baseYawStrength, baseYawStrength)
    local pitchChange = randomPitchDeviation
    pitchChange = math.Clamp(pitchChange, -basePitchStrength, basePitchStrength)

    skillCheck.ViewAngleOffset = Angle(pitchChange, yawChange, 0)
end

        if (key and NeuroController.Scanner.IsSCPRegisteredInNeuro(key)) then
            info.title = scp.name
            if (not scp.template) then
                info.description = scp.description
            end
        end
    end

    return info
end

function NeuroController.Scanner.AddHighlightEntity(entity, highlightType)
    if (not IsValid(entity)) then
        return
    end

    highlightType = highlightType or "default"

    NeuroController.Scanner.HighlightedEntities[entity:EntIndex()] = {
        entity = entity,
        type = highlightType
    }
end

function NeuroController.Scanner.AddHighlightEntityClass(className, highlightType)
    if (not className or not isstring(className)) then
        return
    end

    highlightType = highlightType or "default"

    NeuroController.Scanner.HighlightedEntityClasses[className] = {
        type = highlightType
    }
end

function NeuroController.Scanner.RemoveHighlightEntityClass(className)
    if (not className or not isstring(className)) then
        return
    end

    NeuroController.Scanner.HighlightedEntityClasses[className] = nil
end

function NeuroController.Scanner.RemoveHighlightEntity(entity)
    if (not IsValid(entity)) then
        return
    end

    NeuroController.Scanner.HighlightedEntities[entity:EntIndex()] = nil
end

function NeuroController.Scanner.AddHighlightPlayer(player, highlightType)
    if (not IsValid(player)) then
        return
    end

    highlightType = highlightType or "default"

    NeuroController.Scanner.HighlightedPlayers[player] = {
        player = player,
        type = highlightType
    }
end

function NeuroController.Scanner.RemoveHighlightPlayer(player)
    if (not IsValid(player)) then
        return
    end

    NeuroController.Scanner.HighlightedPlayers[player] = nil
end

function NeuroController.Scanner.AddPlayerFilter(filterName, filterFunction)
    if (not filterName or not isstring(filterName) or not filterFunction or not isfunction(filterFunction)) then
        return
    end

    NeuroController.Scanner.PlayerFilters[filterName] = filterFunction
end

function NeuroController.Scanner.RemovePlayerFilter(filterName)
    if (not filterName or not isstring(filterName)) then
        return
    end

    NeuroController.Scanner.PlayerFilters[filterName] = nil
end

function NeuroController.Scanner.IsEntityHighlighted(entity)
    if (not IsValid(entity)) then
        return false
    end

    if (entity:IsPlayer()) then
        return NeuroController.Scanner.IsPlayerHighlighted(entity)
    end

    if (NeuroController.Scanner.HighlightedEntities[entity:EntIndex()] != nil) then
        return true
    end

    local className = entity:GetClass()
    return NeuroController.Scanner.HighlightedEntityClasses[className] != nil
end

function NeuroController.Scanner.IsPlayerHighlighted(player)
    if (not IsValid(player) or not player:IsPlayer()) then
        return false
    end

    local directlyHighlighted = NeuroController.Scanner.HighlightedPlayers[player] != nil

    if (directlyHighlighted) then
        return true
    end

    for _, filterFunc in pairs(NeuroController.Scanner.PlayerFilters) do
        if (filterFunc(player)) then
            return true
        end
    end

    return false
end

function NeuroController.Scanner.IsSCPRegisteredInNeuro(scpKey)
    if (not scpKey or not isstring(scpKey)) then
        return false
    end

    return NeuroController.Config.SCPNeuro[scpKey] != nil
end

function NeuroController.Scanner.IsPlayerScannable(player)
    if (not IsValid(player)) then
        return false
    end

    local key, scp = VWAR.SCP:GetByPlayer(player)

    if (key and NeuroController.Scanner.IsSCPRegisteredInNeuro(key)) then
        return true
    end
    return false
end

function NeuroController.Scanner.CheckPlayerHighlightStatus(player)
    if (not IsValid(player)) then
        return false
    end

    NeuroController.Scanner.HighlightedPlayers[player] = nil

    if (NeuroController.Scanner.IsPlayerScannable(player)) then
        NeuroController.Scanner.AddHighlightPlayer(player, "neuro")
        return true
    end

    return false
end

function NeuroController.Scanner.HighlightRegisteredNeuroPlayers(highlightType)
    highlightType = highlightType or "neuro"

    NeuroController.Scanner.AddPlayerFilter("RegisteredNeuro", function(player)
        if (not IsValid(player)) then
            return false
        end

        return NeuroController.Scanner.IsPlayerScannable(player)
    end)
end

NeuroController.Scanner.HighlightRegisteredNeuroPlayers()

            },
            {
                name: 'sv_neuro_handler.lua',
                lines: 655,
                realm: 'server',
                private: true,
                content: ``.trim()
            }
        ]

        const codeViewerTabs = document.getElementById('codeViewerTabs')
        const codeContainer = document.getElementById('codeContainer')
        const codeViewerFuncs = document.getElementById('codeViewerFuncs')
        let currentCodeFile = 0

        function showPrivatePopup() {
            if (document.getElementById('privatePopup')) return
            const overlay = document.createElement('div')
            overlay.className = 'popup-overlay'
            overlay.id = 'privatePopup'
            overlay.innerHTML = `
                <div class="popup-box">
                    This file is private for more information contact on discord: k_lua_
                    <br>
                    <button onclick="document.getElementById('privatePopup').remove()">Close</button>
                </div>
            `
            document.body.appendChild(overlay)
        }

        function renderCodeTabs() {
            codeViewerTabs.innerHTML = ''
            codeFiles.forEach((file, idx) => {
                const btn = document.createElement('button')
                btn.className = 'code-viewer-tab' + (idx === currentCodeFile ? ' active' : '')
                btn.textContent = file.name + ` (${file.lines} lines)`
                if (file.realm) {
                    const realmSpan = document.createElement('span')
                    realmSpan.textContent = ` (${file.realm})`
                    realmSpan.style.fontSize = '0.95em'
                    realmSpan.style.color = '#bd93f9'
                    realmSpan.style.marginLeft = '6px'
                    btn.appendChild(realmSpan)
                }
                if (file.private) {
                    btn.classList.add('locked')
                    btn.onclick = function(e) {
                        e.preventDefault()
                        showPrivatePopup()
                    }
                } else {
                    btn.onclick = function() {
                        if (currentCodeFile !== idx) {
                            currentCodeFile = idx
                            renderCode()
                            renderCodeTabs()
                            renderFuncList()
                        }
                    }
                }
                codeViewerTabs.appendChild(btn)
            })
        }

        function highlightLuau(code) {
            const keywords = /\b(local|function|return|if|then|end|not|and|or)\b/g
            const strings = /(["'])(?:(?=(\\?))\2.)*?\1/g
            const numbers = /\b\d+(\.\d+)?\b/g

            let html = code
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')

            html = html.replace(strings, m => `<span class="code-highlight-string">${m}</span>`)
            html = html.replace(keywords, m => `<span class="code-highlight-keyword">${m}</span>`)
            html = html.replace(numbers, m => `<span class="code-highlight-number">${m}</span>`)

            return html
        }

        function renderCode() {
            const file = codeFiles[currentCodeFile]
            const lines = file.content.split('\n')

            codeContainer.innerHTML = ''

            const containerStyles = window.getComputedStyle(codeContainer)
            const minHeight = parseInt(containerStyles.minHeight)
            const maxHeight = parseInt(containerStyles.maxHeight)
            let containerHeight = codeContainer.offsetHeight
            if (containerHeight < minHeight) containerHeight = minHeight
            if (containerHeight > maxHeight) containerHeight = maxHeight

            const codeWrapper = document.createElement('div')
            codeWrapper.style.display = 'flex'
            codeWrapper.style.width = '100%'
            codeWrapper.style.height = '100%'
            codeWrapper.style.position = 'relative'

            const codeLines = document.createElement('div')
            codeLines.className = 'code-lines'
            codeLines.style.flex = 'none'
            codeLines.style.overflow = 'hidden'
            codeLines.style.display = 'block'
            codeLines.style.boxSizing = 'border-box'
            codeLines.style.height = '100%'
            codeLines.innerHTML = lines.map((_, i) => i + 1).join('<br>')

            const codeContent = document.createElement('div')
            codeContent.className = 'code-content'
            codeContent.style.height = '100%'
            codeContent.style.overflowY = 'auto'
            codeContent.style.flex = '1'
            codeContent.style.boxSizing = 'border-box'
            codeContent.style.background = '#23272a'
            codeContent.style.display = 'flex'
            codeContent.style.flexDirection = 'column'
            codeContent.style.justifyContent = 'stretch'
            codeContent.innerHTML = `<pre style="margin:0;white-space:pre-wrap;word-break:break-word; height:100%; display:flex; flex-direction:column; justify-content:stretch;"><code class="hljs" style="flex:1;">${highlightLuau(file.content)}</code></pre>`

            codeWrapper.appendChild(codeLines)
            codeWrapper.appendChild(codeContent)

            codeContainer.appendChild(codeWrapper)

            codeContent.onscroll = function() {
                codeLines.scrollTop = codeContent.scrollTop
            }
        }

        function getFunctions(code) {
            const funcRegex = /function\s+([a-zA-Z_][\w]*)\s*\(([^)]*)\)/g
            const lines = code.split('\n')
            let match, funcs = []
            while ((match = funcRegex.exec(code)) !== null) {
                let lineNum = 0
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes(match[0])) {
                        lineNum = i
                        break
                    }
                }
                funcs.push({
                    name: match[1],
                    params: match[2],
                    line: lineNum
                })
            }
            return funcs
        }

        function renderFuncList() {
            const file = codeFiles[currentCodeFile]
            const funcs = getFunctions(file.content)
            codeViewerFuncs.innerHTML = ''
            funcs.forEach(func => {
                const div = document.createElement('div')
                div.style.cursor = 'pointer'
                div.style.marginBottom = '10px'
                div.innerHTML = `<span class="code-highlight-func">${func.name}</span><span class="code-highlight-param">(${func.params})</span>`
                div.onclick = function() {
                    const codeContent = codeContainer.querySelector('.code-content')
                    const codeLines = codeContainer.querySelector('.code-lines')
                    const lineHeight = codeContent.scrollHeight / codeContent.innerText.split('\n').length
                    codeContent.scrollTop = func.line * lineHeight
                    codeLines.scrollTop = func.line * lineHeight
                }
                codeViewerFuncs.appendChild(div)
            })
        }

        renderCodeTabs()
        renderCode()
        renderFuncList()
    </script>
