<!DOCTYPE html>
<html>
<head>
    <title>Klua's Portfolio</title>
    <link rel="icon" type="image/png" href="assets/images/klua.png">
    <link rel="stylesheet" href="assets/styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 100vw;
            min-height: 100vh;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }
        main, header, footer, section, .cards {
            background: rgba(32,34,37,0.82);
            backdrop-filter: blur(2px);
        }
        main {
            background: transparent;
            box-shadow: none;
            border-radius: 18px;
            margin: 32px auto;
            max-width: 1100px;
        }
        header, footer {
            border-radius: 18px 18px 0 0;
        }
        section {
            border-radius: 12px;
            margin-bottom: 18px;
        }
        .cards {
            background: transparent;
            border-radius: 0;
        }
    </style>
</head>
<body>
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="assets/images/ThisisGMOD.mp4" type="video/mp4">
    </video>
    <header>
        <h1>Klua's Portfolio</h1>
        <nav>
            <ul style="display:flex; align-items:center; gap:18px;">
                <li><button class="button" onclick="location.href='about.html'">About Me</button></li>
                <li>
                    <a href="https://github.com/K-Lua" target="_blank" style="display:inline-block;">
                        <img src="assets/images/Github.png" alt="Github" style="width:32px; height:32px; vertical-align:middle;">
                    </a>
                </li>
                <li>
                    <a href="https://create.roblox.com/talent/creators/7833877231" target="_blank" style="display:inline-block;">
                        <img src="assets/images/Roblox.png" alt="Roblox" style="width:32px; height:32px; vertical-align:middle;">
                    </a>
                </li>
                <li>
                    <a href="https://www.youtube.com/@KLua-c4j" target="_blank" style="display:inline-block;">
                        <img src="assets/images/YouTube.png" alt="YouTube" style="width:32px; height:32px; vertical-align:middle;">
                    </a>
                </li>
                <li>
                    <button id="discord-btn" style="background:none; border:none; cursor:pointer; padding:0;">
                        <img src="assets/images/Discord.png" alt="Discord" style="width:32px; height:32px; vertical-align:middle;">
                    </button>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Projects</h2>
            <div class="cards" id="projects-cards"></div>
        </section>
        <section>
            <h2>Experience</h2>
            <div class="cards" id="experience-cards"></div>
        </section>
    </main>
    <footer>
        <p>Klua's Portfolio</p>
    </footer>
    <script src="scripts/main.js"></script>
    <script>
        const discordBtn = document.getElementById('discord-btn')
        discordBtn.onclick = function() {
            navigator.clipboard.writeText('k_lua_').then(function() {
                let notif = document.createElement('div')
                notif.textContent = 'Copied to clipboard: k_lua_'
                notif.style.position = 'fixed'
                notif.style.top = '24px'
                notif.style.right = '24px'
                notif.style.background = '#23272a'
                notif.style.color = '#fff'
                notif.style.padding = '12px 24px'
                notif.style.borderRadius = '8px'
                notif.style.boxShadow = '0 2px 12px rgba(40,44,52,0.2)'
                notif.style.zIndex = '9999'
                notif.style.fontSize = '1rem'
                document.body.appendChild(notif)
                setTimeout(function() {
                    notif.remove()
                }, 1800)
            })
        }
    </script>
</body>
</html>
